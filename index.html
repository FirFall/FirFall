<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FirFall</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="yt-header">
  <div class="h-left">
    <button id="menuBtn" class="yt-icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" fill="currentColor"/></svg>
    </button>
    <a class="yt-logo" href="#">
      <span class="fire-badge">
        <svg viewBox="0 0 28 24" width="32" height="26"><defs><linearGradient id="fireG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD23F"/><stop offset=".45" stop-color="#FF7A00"/><stop offset="1" stop-color="#FF2300"/></linearGradient></defs><path d="M14 1c-.8 3.5-4.5 5-4.5 9.5 0 1 .2 1.9.6 2.7.4-1 1-1.9 2-2.5-.2 1.5.3 2.7 1.2 3.6.6-1.1 1.2-2.1 1.4-3.6 1 1.2 2.3 2.6 2.3 5.3a6.5 6.5 0 0 1-13 0C4 9.5 10.5 6.5 14 1Z" fill="url(#fireG)"/><path d="M12.6 10.2v5.6l4.8-2.8-4.8-2.8z" fill="#fff"/></svg>
      </span>
      <span class="logo-word">Fir<span class="fire-text">Fall</span></span>
    </a>
  </div>
  <div class="h-center">
    <div class="yt-search">
      <input id="searchInput" type="text" placeholder="Search" />
      <button class="yt-search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" fill="currentColor"/></svg>
      </button>
    </div>
    <button class="yt-icon-btn yt-mic" aria-label="Voice">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="h-right">
    <button class="yt-icon-btn" aria-label="Create">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2zm2-8H8a4 4 0 0 0-4 4v6a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V9a4 4 0 0 0-4-4zm0 12H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2z" fill="currentColor"/></svg>
    </button>
    <button class="yt-icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-5H5V9a7 7 0 0 1 5-6.71V1.5a1.5 1.5 0 0 1 3 0v.79A7 7 0 0 1 19 9v8zm-2 0V9a5 5 0 0 0-3.5-4.78V4a1.5 1.5 0 0 0-3 0v.22A5 5 0 0 0 7 9v8h10z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<div class="yt-chips">
  <button class="yt-chip active">All</button>
  <button class="yt-chip">Music</button>
  <button class="yt-chip">Gaming</button>
  <button class="yt-chip">Live</button>
  <button class="yt-chip">Podcasts</button>
  <button class="yt-chip">Cooking</button>
  <button class="yt-chip">Tech</button>
  <button class="yt-chip">Sports</button>
  <button class="yt-chip">News</button>
</div>

<div class="yt-layout">
  <aside class="yt-sidebar" id="sidebar">
    <a class="active" href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z" fill="currentColor"/></svg><span>Home</span></a>
    <a href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M17.77 10.32 7.9 4.5v14.9l9.87-5.83-.68-1.13 2.62-1.56-.68-1.13 2.62-1.56-.68-1.13 2.62-1.56-.68-1.13 2.62-1.56-.68-1.12zM7 15.5V7.9l7.9 3.85L7 15.5z" fill="currentColor"/></svg><span>Shorts</span></a>
    <a href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 8H4V6h16v2zm-2 4H6v6h12v-6zm2 8H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z" fill="currentColor"/></svg><span>Subscriptions</span></a>
    <hr/>
    <a href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 13a1.5 1.5 0 0 0 1.5-1.5c0-.65-.42-1.2-1-1.41V7.5a.5.5 0 0 0-1 0v2.59c-.58.21-1 .76-1 1.41A1.5 1.5 0 0 0 12 13zm0-9a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V4z" fill="currentColor"/></svg><span>History</span></a>
    <a href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6V4zm1 2v6l5 3-.8 1.28L11 12.5V6h1z" fill="currentColor"/></svg><span>Watch Later</span></a>
  </aside>
  <main class="yt-main">
    <div class="blank-state">
      <h2>Blank canvas — ready for backend</h2>
      <p>No videos, no login yet. Frontend shell only.</p>
    </div>
    <div class="yt-grid" id="grid"></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
