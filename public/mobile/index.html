<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>FirFall</title>
<style>
/* FirFall for Android - a YouTube-app-shaped shell over the real FirFall API.
   Colours follow the YouTube dark theme so the app reads as familiar, but no
   YouTube CSS, fonts or images are copied: every rule here is hand written and
   every pixel of artwork is drawn or pulled from FirFall itself. */
:root{
  --bg:#0f0f0f; --bg2:#1c1c1c; --bg3:#272727; --line:#303030;
  --txt:#f1f1f1; --dim:#aaa; --dim2:#717171;
  --red:#ff0000; --redDim:#c4302b; --redSoft:#ff8f86;
  --blue:#3ea6ff;
  --safeTop:env(safe-area-inset-top,0px); --safeBot:env(safe-area-inset-bottom,0px);
  --nav:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt); overflow:hidden;
  font-family:Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit}
.hidden{display:none !important}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll.below{padding-top:calc(58px + var(--safeTop))}
.scroll.above{padding-bottom:calc(var(--nav) + var(--safeBot))}
::-webkit-scrollbar{width:0;height:0}

/* ---------- top app bar ---------- */
#topbar{
  position:fixed;top:0;left:0;right:0;height:calc(58px + var(--safeTop));
  padding:var(--safeTop) 6px 0; display:flex;align-items:center;gap:4px;
  background:var(--bg); z-index:40; border-bottom:1px solid transparent;
}
#topbar.stuck{border-bottom-color:var(--line)}
/* The mark is the hand-made logo, which is a wide banner shape rather than a
   square, so it is sized by height and the width follows the artwork's own
   aspect ratio. The height is capped well below the top bar so it reads as a
   logo and not as a banner. */
.brand{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:100%;min-width:0}
.brand-mark{height:22px;max-width:130px;flex:0 0 auto;display:flex;align-items:center;overflow:hidden}
.brand-mark svg{height:22px;width:auto;display:block}
.brand-mark img{height:22px;width:auto;max-width:130px;display:block;object-fit:contain}
/* Logo artwork already contains the FirFall wordmark, so the text is hidden
   rather than repeated. Kept for screen readers and as fallback if img fails. */
.brand-name{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;position:relative}
.icon-btn:active{background:var(--bg3)}
.icon-btn svg{width:24px;height:24px;fill:var(--txt)}
/* Unread marker on the bell. Positioned against .icon-btn, which is relative. */
#notifDot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 2px var(--bg);pointer-events:none}
#avatarBtn{width:34px;height:34px;background:#3f3f3f;color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin:0 4px}
#avatarBtn.me{background:var(--red)}

/* ---------- search ---------- */
#searchWrap{position:fixed;top:0;left:0;right:0;height:calc(58px + var(--safeTop));
  padding:var(--safeTop) 8px 0;background:var(--bg);z-index:45;display:flex;
  align-items:center;gap:8px;transform:translateY(-110%);transition:transform .18s}
#searchWrap.on{transform:translateY(0)}
.search-field{flex:1;display:flex;align-items:center;background:var(--bg3);
  border-radius:20px;padding:0 4px 0 16px;height:40px}
.search-field input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:16px;min-width:0}
.search-field svg{width:22px;height:22px;fill:var(--dim)}
#searchGo{padding:8px 10px;font-weight:700;font-size:14px;color:var(--blue);border-radius:20px}

/* ---------- chips ---------- */
#chips{position:fixed;left:0;right:0;top:calc(58px + var(--safeTop));z-index:39;
  display:flex;gap:8px;padding:8px 12px;background:var(--bg);overflow-x:auto;
  border-bottom:1px solid transparent;transition:border-color .15s}
#chips.stuck{border-bottom-color:var(--line)}
#chips.stuck.hide{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:8px;background:var(--bg3);
  color:var(--txt);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:#f1f1f1;color:#0f0f0f}

/* ---------- video card ---------- */
.vcard{display:block;width:100%;text-align:left;padding:0 0 12px}
.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#1f1f1f;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#232323,#141414)}
.thumb .ph span{font-size:40px;font-weight:800;color:#2e2e2e}
/* Watched progress bar along the bottom of the thumbnail. */
.thumb .seen{position:absolute;left:0;bottom:0;height:3px;background:#f1f1f1;opacity:.9}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;
  font-size:12px;font-weight:600;padding:1px 4px;border-radius:4px;letter-spacing:.3px}
/* The overflow button on the thumbnail is the most recognisable part of the
   YouTube feed card, and it is where Save, Share and Report live. */
.kebab{position:absolute;right:2px;top:2px;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:rgba(0,0,0,.45)}
.kebab:active{background:rgba(0,0,0,.75)}
.kebab svg{width:20px;height:20px;fill:currentColor}
.vmeta{display:flex;gap:12px;padding:10px 12px 0}
.vav{width:36px;height:36px;border-radius:50%;background:#3f3f3f;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.vtext{min-width:0;flex:1}
.vtitle{font-size:15px;font-weight:500;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.vtitle.seen-t{color:var(--dim)}
.vsub{font-size:13px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:var(--dim2);flex:0 0 auto}

/* ---------- skeleton loading ---------- */
/* YouTube fills the screen with grey placeholder blocks while the feed loads.
   It reads as content arriving rather than as a spinner in the middle of
   nothing, and it stops the layout jumping when the real cards land. */
.sk{background:linear-gradient(90deg,#1f1f1f 25%,#2a2a2a 37%,#1f1f1f 63%);
  background-size:400% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:6px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-card{padding-bottom:12px}
.sk-card .sk-thumb{width:100%;aspect-ratio:16/9;border-radius:0}
.sk-card .sk-meta{display:flex;gap:12px;padding:10px 12px 0}
.sk-card .sk-av{width:36px;height:36px;border-radius:50%;flex:0 0 auto}
.sk-card .sk-lines{flex:1;display:flex;flex-direction:column;gap:7px;padding-top:3px}
.sk-card .sk-l1{height:12px;width:85%}
.sk-card .sk-l2{height:12px;width:55%}

/* ---------- pull to refresh ---------- */
.ptr{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;
  justify-content:center;overflow:hidden;pointer-events:none;color:var(--dim)}
.ptr .arw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;
  transition:transform .18s}
.ptr .arw svg{width:20px;height:20px;fill:var(--dim)}
.ptr .arw.spin svg{animation:ptrspin .9s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}

/* ---------- bottom nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safeBot));
  padding-bottom:var(--safeBot);background:var(--bg);border-top:1px solid var(--line);
  display:flex;z-index:50}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.2px}
.nitem svg{width:24px;height:24px;fill:currentColor}
.nitem.on{color:var(--txt)}
.nitem.on svg{fill:var(--txt)}
.nitem .lbl{white-space:nowrap}

/* ---------- watch ---------- */
#playerBox{position:relative;width:100%;background:#000;aspect-ratio:16/9}
#playerBox video{width:100%;height:100%;display:block;background:#000}
/* An ember plays in a vertical frame. A browser cannot re-encode a 16:9 file
   into 9:16 without a codec library this site does not carry, so the shape is
   corrected at playback instead: the box is given a 9:16 ratio and sized from
   its height, and object-fit:contain keeps a landscape clip whole inside that
   frame - letterboxed on black - rather than cropping it or stretching it
   into something nobody asked for. The stored file and the 9:16 thumbnail are
   untouched, so a landscape ember still cuts to a vertical card in the feed. */
#playerBox.vert{width:auto;height:74vh;aspect-ratio:9/16;margin:0 auto}
#playerBox.vert video{object-fit:contain}
#pfab{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);border-radius:6px;
  padding:4px 8px;font-size:11px;font-weight:700;color:#fff}
/* Double tap to seek, the gesture people expect on a phone. The +10 / -10
   bubble is drawn by the shell so the page does not have to animate it. */
#seekFx{position:absolute;inset:0;display:flex;align-items:center;justify-content:0;
  pointer-events:none}
.seek-bubble{position:absolute;display:flex;align-items:center;justify-content:center;
  width:88px;height:88px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff}
.seek-bubble svg{width:38px;height:38px;fill:#fff}
.watch-body{padding:12px 12px 24px}
.wtitle{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:12px;word-break:break-word}
.wchan{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wchan .vav{width:40px;height:40px;font-size:16px}
.wcname{font-weight:600;font-size:15px}
.wcsub{font-size:12px;color:var(--dim);margin-top:1px}
.sub-btn{background:#f1f1f1;color:#0f0f0f;font-weight:700;font-size:14px;
  padding:9px 18px;border-radius:20px;flex:0 0 auto}
.sub-btn.on{background:var(--bg3);color:var(--txt)}
/* YouTube lays the actions out as a scrollable row of pills with a divider
   before the secondary group. */
.wacts{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;
  border-bottom:1px solid var(--line);margin-bottom:14px;align-items:center}
.act{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;
  background:var(--bg3);font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.act:active{background:#3a3a3a}
.act svg{width:18px;height:18px;fill:currentColor}
.act.on{background:#fff;color:#0f0f0f}
.act.flag{border:1px solid var(--redDim);color:var(--redSoft)}
.act-div{width:1px;height:24px;background:var(--line);flex:0 0 auto;margin:0 2px}
.speed-btn{font-variant-numeric:tabular-nums}
/* The description is a tappable card: collapsed shows a couple of lines, the
   tap expands it, exactly like the YouTube watch page. */
.desc{background:var(--bg2);border-radius:12px;padding:12px;font-size:14px;
  line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-bottom:20px}
.desc .dmeta{font-weight:700;margin-bottom:6px;font-size:13px}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc .dmore{color:var(--txt);font-weight:600;margin-top:8px;display:block}
.sect-h{font-size:16px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.sect-h .count{font-weight:400;color:var(--dim);font-size:14px}
.comment{display:flex;gap:12px;padding:0 0 16px}
.comment .cav{width:32px;height:32px;font-size:13px;flex:0 0 auto}
.cbody{min-width:0;flex:1}
.cwho{font-size:13px;font-weight:600;margin-bottom:2px}
.cwho .badge-mod{background:var(--red);color:#fff;font-size:10px;font-weight:700;
  padding:1px 4px;border-radius:3px;margin-left:5px}
.ctime{font-size:12px;color:var(--dim);margin-left:8px;font-weight:400}
.ctext{font-size:14px;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.cfoot{display:flex;align-items:center;gap:10px;margin-top:6px}
.cfoot button{font-size:12px;font-weight:600;color:var(--dim)}
.cfoot .replied{color:var(--dim2);font-size:12px}
.cadd{display:flex;gap:8px;align-items:flex-start;margin-bottom:24px}
.cadd .cav{width:32px;height:32px;font-size:13px}
.cadd textarea{flex:1;background:none;border:0;outline:0;color:var(--txt);resize:none;
  font-size:14px;line-height:1.4;min-height:22px;max-height:120px;padding:4px 0}
.cadd .cbtn{color:var(--dim);font-size:14px;font-weight:700;padding:4px 6px;flex:0 0 auto}
.cadd .cbtn.go{color:var(--blue)}

/* ---------- channel ---------- */
#chBanner{width:100%;aspect-ratio:6/1;background:linear-gradient(135deg,#2a2a2a,#151515);position:relative}
#chHead{padding:12px 16px 16px;display:flex;gap:14px;align-items:center}
#chAvatar{width:64px;height:64px;border-radius:50%;background:#3f3f3f;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:0 0 auto}
#chName{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#chStats{font-size:13px;color:var(--dim);margin-top:3px}

/* ---------- feed tail ---------- */
.vcard-wrap{position:relative}
/* The Embers feed is a three-across grid of vertical cards, not the full-width
   16:9 rows the normal feed uses. :not(.hidden) is required - an id selector
   beats the .hidden utility class, so without it the grid would override the
   rule that keeps the feed off screen and the tab could never be hidden. */
#feed.vgrid:not(.hidden){display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;padding:10px 8px}
#feed.vgrid .vcard{padding:0}
#feed.vgrid .thumb{aspect-ratio:9/16;border-radius:10px}
#feed.vgrid .vtitle{-webkit-line-clamp:1}
#feed.vgrid .vsub{display:none}
#feed.vgrid .kebab{width:30px;height:30px;right:4px;top:4px}
#feed.vgrid .kebab svg{width:16px;height:16px}
/* One card per column, so the meta goes under a smaller thumbnail rather than
   beside a full-width one. */
#feed.vgrid .vmeta{gap:8px;padding:8px 4px 0}
#feed.vgrid .vav{display:none}
/* The feed tail: a spinner while the next page loads, then a quiet end mark. */
.spin-foot{margin:20px 0 30px}
.feed-end{text-align:center;color:var(--dim2);font-size:13px;padding:22px 0 30px}
.chip-sub{font-size:13px;color:var(--dim);font-weight:600;padding:8px 4px}

/* ---------- rows: unread state ---------- */
.row.unread .rt{font-weight:700}
.row.unread{background:rgba(255,255,255,.03)}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:0 0 auto;margin-right:12px}

/* ---------- sheets: menu list ---------- */
/* The overflow menu is a list of icon+label rows, not a stack of buttons. */
.menu{display:flex;flex-direction:column;margin:14px -20px -8px}
.menu button{display:flex;align-items:center;gap:18px;width:100%;text-align:left;
  padding:15px 20px;font-size:15px;color:var(--txt)}
.menu button:active{background:rgba(255,255,255,.08)}
.menu button svg{width:22px;height:22px;fill:var(--dim);flex:0 0 auto}
.menu button span{flex:1}
.share-url{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  color:var(--txt);font-size:13px;padding:11px 12px;margin:14px 0;outline:0}

/* ---------- toast with an action ---------- */
#toast{pointer-events:none}
#toast.on{pointer-events:auto}
.t-act{margin-left:14px;color:#065fd4;font-weight:700;font-size:14px;padding:0 2px}


.row{display:flex;gap:14px;padding:8px 12px;align-items:center;width:100%;text-align:left}
.row .rthumb{width:132px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:0 0 auto;background:#1f1f1f;position:relative}
.row .rthumb img{width:100%;height:100%;object-fit:cover}
.row .rthumb .dur{right:4px;bottom:4px;font-size:11px}
.row .rtxt{min-width:0;flex:1}
.row .rt{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.row .rt.seen-t{color:var(--dim)}
.row .rs{font-size:12px;color:var(--dim);margin-top:4px}
.row .rk{width:40px;height:40px;flex:0 0 auto;color:var(--dim);display:flex;
  align-items:center;justify-content:center}
.row .rk svg{width:20px;height:20px;fill:currentColor}
.group-h{font-size:15px;font-weight:700;padding:18px 12px 6px;display:flex;
  align-items:center;justify-content:space-between}
.linkish{color:var(--blue);font-size:13px;font-weight:600}
.lib-item{display:flex;width:100%;text-align:left;align-items:stretch}
.lib-item .li-thumb{width:168px;flex:0 0 auto;aspect-ratio:16/9;background:#1f1f1f;
  position:relative;overflow:hidden}
.lib-item .li-thumb img{width:100%;height:100%;object-fit:cover}
.lib-item .li-body{flex:1;min-width:0;padding:10px 8px 10px 12px;display:flex;flex-direction:column;justify-content:center}
.lib-item .li-t{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lib-item .li-c{font-size:12px;color:var(--dim);margin-top:5px}
.lib-item .li-c b{color:var(--txt);font-weight:400}

/* Library top bar: a big "Your Library" title with filter chips beneath,
   which is what YouTube shows when you open Library from the bottom nav. */
.lib-hero{padding:6px 12px 4px;font-size:24px;font-weight:700;letter-spacing:-.4px}
.lib-hero .avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
  vertical-align:middle;margin-right:10px}
.lib-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg2);
  border-radius:8px;margin:12px}
.lib-bar::-webkit-scrollbar{height:0}
.lib-bar button{flex:0 0 auto;padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.1);
  color:var(--txt);font-size:13px;font-weight:600;white-space:nowrap}
.lib-bar button.on{background:#f1f1f1;color:#0f0f0f}

/* ---------- empty / loading ---------- */
.empty{padding:56px 24px;text-align:center;color:var(--dim);font-size:14px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:12px;opacity:.5}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safeBot) + 20px);
  transform:translate(-50%,14px);background:#e5e5e5;color:#0f0f0f;padding:11px 18px;
  border-radius:8px;font-size:14px;font-weight:600;z-index:90;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:34px;height:34px;border:3px solid var(--bg3);border-top-color:var(--txt);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- sheets (report / sign in) ---------- */
/* Above #shorts (90): the Shorts panel opens the comments sheet, and a sheet
   that renders underneath a full-screen video is a sheet you cannot read. */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:95;opacity:0;
  pointer-events:none;transition:opacity .18s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);z-index:96;
  border-radius:16px 16px 0 0;padding:8px 16px calc(20px + var(--safeBot));
  transform:translateY(102%);transition:transform .2s;max-height:86vh;overflow-y:auto}
#sheet.on{transform:translateY(0)}
.sheet-h{width:38px;height:4px;border-radius:2px;background:#4a4a4a;margin:0 auto 14px}
#sheetTitle{font-size:17px;font-weight:700;margin-bottom:4px}
#sheetSub{font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.45}
.why{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.why button{padding:8px 14px;border-radius:18px;background:var(--bg3);font-size:14px;font-weight:600}
.why button.on{background:var(--txt);color:#0f0f0f}
#sheetTa{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:12px;font-size:14px;resize:none;outline:0;min-height:74px;
  font-family:inherit;margin-bottom:14px}
#sheetTa:focus{border-color:var(--blue)}
.sheet-go{width:100%;background:var(--red);color:#fff;font-weight:700;font-size:15px;
  padding:13px;border-radius:24px}
.sheet-go:disabled{opacity:.5}
.sheet-msg{font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.sheet-msg.ok{color:#7cc79b}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;color:var(--txt);padding:13px;font-size:16px;outline:0;
  font-family:inherit;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.sheet-alt{text-align:center;font-size:14px;margin-top:14px;color:var(--dim)}
/* ---------- embers: record + upload ---------- */
/* Full-screen camera overlay. Sits above everything including the top bar so
   the recording UI owns the whole display, the way a camera app does. */
#camWrap{position:fixed;inset:0;z-index:80;background:#000;display:none}
#camWrap.on{display:block}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
/* Mirrored while recording the front camera, matching what the previewer
   expects; flipped back for playback so text in the scene is not reversed. */
#camVideo.mirror{transform:scaleX(-1)}
.cam-top{position:absolute;top:calc(var(--safeTop) + 10px);left:0;right:0;display:flex;
  align-items:center;justify-content:space-between;padding:0 12px;z-index:2}
.cam-top button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);
  color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
#camTimer{position:absolute;top:calc(var(--safeTop) + 16px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:13px;
  padding:4px 12px;border-radius:14px;z-index:2;display:none;align-items:center;gap:7px}
#camTimer.on{display:flex}
#camTimer .dot{width:8px;height:8px;border-radius:50%;background:#ff4b4b;
  animation:recblink 1.1s ease-in-out infinite}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.25}}
#camBar{position:absolute;bottom:calc(var(--nav) + var(--safeBot) + 18px);left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:12px;z-index:2}
#camHint{color:#fff;font-size:12.5px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#camRec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);
  position:relative;transition:background .15s}
#camRec.rec{background:#ff4b4b;border-color:rgba(255,255,255,.9);
  animation:recpulse 1.1s ease-in-out infinite}
@keyframes recpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#camSwitch{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
  font-size:19px;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Same for the two controls either side of it: a tap on a round button should
   fire, not sit waiting for the double-tap delay. */
#camRec,#camPick{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#camPick{color:#fff;font-size:13px;font-weight:600;padding:8px}
/* Frozen last frame + play/pause review controls after recording stops. */
#camReview{position:absolute;inset:0;display:none;background:#000;z-index:3}
#camReview.on{display:block}
#camReview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam-actions{position:absolute;bottom:calc(var(--nav) + var(--safeBot) + 18px);left:0;right:0;
  display:flex;justify-content:center;gap:14px;z-index:2}
.cam-actions button{flex:0 0 auto;min-width:110px;padding:11px 18px;border-radius:22px;
  font-weight:700;font-size:14px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.cam-actions .go{background:var(--red);border-color:var(--red)}
/* Upload progress inside the sheet. The bar mirrors the desktop fire gradient. */
#upProgWrap{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.up-bar{height:6px;background:#333;border-radius:4px;overflow:hidden}
.up-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffb800,#ff6a00,#ff2d00);transition:width .2s}
#upState{color:var(--dim);font-size:13px}
/* The library has no bottom-nav button any more, so Subscriptions ends with a
   short list of the two things people actually go back for: what they watched
   and what they saved. */
.lib-quick{display:flex;gap:10px;padding:0 12px 12px}
.lq{flex:1 1 0;min-width:0;text-align:left;background:#1f1f1f;border:1px solid #303030;
  border-radius:10px;padding:12px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.lq:hover{background:#282828;border-color:#4d4d4d}
.lq:active{background:#2f2f2f}
.lq-t{display:block;color:#f1f1f1;font-size:14px;font-weight:600}
.lq-c{display:block;margin-top:3px;color:var(--dim2);font-size:12px}
.sheet-alt button{color:var(--blue);font-weight:700}

/* ---------- ban screen ---------- */
#ban{position:fixed;inset:0;background:#1a1a1a;z-index:200;display:flex;
  align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#ban .bx{max-width:420px;width:100%;background:#202020;border:2px solid var(--redDim);
  border-radius:6px;padding:26px 22px;text-align:center}
#ban h1{color:var(--red);font-size:26px;letter-spacing:3px;margin:0 0 6px;font-weight:800}
#ban .sub{color:#bbb;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:20px}
#ban table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:13px;text-align:left}
#ban td{padding:9px 0;border-bottom:1px solid #333;color:#ccc;vertical-align:top}
#ban td:first-child{color:#888;width:38%;text-transform:uppercase;font-size:11px;
  letter-spacing:.6px;padding-right:10px}
#ban p{color:#aaa;font-size:13px;line-height:1.6;margin:0 0 18px}
#ban .bg2{background:#2a2a2a;color:#fff;font-weight:700;font-size:15px;
  padding:13px;border-radius:4px;width:100%}
#ban .bgl{margin-top:12px;color:#888;font-size:12px;text-decoration:underline}

/* =====================================================================
   SHORTS: the full-screen vertical player
   =====================================================================
   An ember is a short vertical clip, so it gets the Shorts treatment rather
   than a landscape watch page: one clip filling the screen, swipe up for the
   next. The track is a plain scroll-snap container, which is what gives the
   gesture, the snap and the momentum for free - hand-rolled touch maths would
   have to reimplement all of it badly. */
#shorts{position:fixed;inset:0;z-index:90;background:#000;display:none}
#shorts.on{display:block}
.shorts-track{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;
  overscroll-behavior:contain}
.shorts-track::-webkit-scrollbar{display:none}
.short{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center;position:relative}
/* The 9:16 stage. A landscape ember still plays whole inside it, letterboxed,
   rather than being cropped to fill - see #playerBox.vert. */
.short-stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;
  background:#000;overflow:hidden}
.short-stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.short-tap{position:absolute;inset:0;z-index:1}
.short-big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:2;opacity:0;transition:opacity .12s;pointer-events:none}
.short-big svg{width:64px;height:64px;fill:rgba(255,255,255,.85)}
.short-stage.paused .short-big{opacity:1}
/* Who posted it and what it is called, bottom left. */
.short-info{position:absolute;left:0;right:78px;bottom:16px;z-index:3;
  padding:0 14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:none}
.short-info .sh-at{font-size:14px;font-weight:700;margin-bottom:5px}
.short-info .sh-ti{font-size:13px;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* The action rail down the right, where YouTube puts it. */
.short-rail{position:absolute;right:4px;bottom:16px;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:15px}
.short-rail button{background:none;color:#fff;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11px;font-weight:600;
  text-shadow:0 1px 3px rgba(0,0,0,.75);padding:0}
.short-rail svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.short-rail button.on svg{fill:var(--red)}
.short-rail .sh-av{width:44px;height:44px;border-radius:50%;background:#3f3f3f;
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px}
.short-rail .sh-av.mine{border-color:var(--red)}
/* Progress: a hairline that fills, the way a Short does. */
.short-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22);z-index:4}
.short-prog i{display:block;height:100%;width:0;background:var(--red)}
.short-top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;
  align-items:center;gap:8px;padding:calc(10px + var(--safeTop)) 12px 10px;
  background:linear-gradient(rgba(0,0,0,.5),transparent)}
.short-top button{color:#fff;background:rgba(0,0,0,.35);border-radius:50%;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.short-top svg{width:22px;height:22px;fill:#fff}
.short-top .sh-lbl{flex:1;text-align:center;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.7)}
#shortsMsg{position:absolute;inset:0;z-index:6;display:flex;align-items:center;
  justify-content:center;color:#fff;text-align:center;padding:80px 30px;
  font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#shortsMsg.hidden{display:none}
</style>
</head>

/* =====================================================================
   FirFall for Android
   Talks to the same FirFall API the website uses. No sample content, no
   placeholder channels: if the API has nothing, the screen says so.

var API = "https://firfall-auth.b8golddude.workers.dev";
var K_TOKEN="ff_token", K_USER="ff_user", K_ROLE="ff_role", K_MYREP="ff_myrep";
var K_LATER="ff_later", K_HIST="ff_hist", K_SPEED="ff_speed", K_SEEN="ff_seen";

var me = null, myRole = "user";
var curTab = "home", curVideo = null, curChannel = null;
var feedSort = "new", searchQ = "";
var libFilter = "recent";
var subState = {}, myReports = {};
var player = null, playRate = 1;
var feedOffset = 0, feedTotal = null, feedLoading = false, feedOwner = null;

/* The flame mark, as one polygon in a 24x24 box.
   This is the single source of truth for the logo: the top bar renders it
   through svgFromPoints, the launcher icons are generated from the same
   numbers by make-icons.mjs, and the vector drawable is written from it.
   A rounded rectangle with a play triangle is what YouTube uses, and
   FirFall is not YouTube, so it is a flame. */
var FLAME = [[12,1.4],[14.9,6.2],[13.1,9.6],[16.9,8.1],[19.3,13.2],[19.3,17.6],
             [16.4,21.6],[12,22.9],[7.6,21.6],[4.7,17.6],[4.7,13.2],[7.9,10.4],

function svgFromPoints(pts, fill){
  var d = pts.map(function(p,i){ return (i?"L":"M") + p[0] + " " + p[1]; }).join(" ") + " Z";
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="' + fill + '" d="' + d + '"/></svg>';
}

/* Icons. Drawn here rather than inlined at each call site so the same glyph is
   used by the feed, the watch page and the sheets, and so a size change is one
   edit. */
var ICON = {
  kebab:'<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>',

  dislike:'<svg viewBox="0 0 24 24"><path d="M5.23 13h4.23l-1.52 4.94C7.62 18.97 8.46 20 9.62 20c.58 0 1.14-.24 1.52-.65L17 13h4V3h-4H8.57c-1.06 0-1.98.67-2.19 1.61l-1.34 6C4.77 11.85 5.82 13 7.23 13zM17 4h3v8h-3V4zM4.02 10.83l1.34-6C5.45 4.5 5.74 4.3 6.05 4.3H16v8.61l-5.6 6.06c-.19.21-.48.33-.78.33-.26 0-.5-.11-.63-.3-.07-.1-.15-.26-.09-.47l1.52-4.94c.09-.26.02-.54-.16-.71a.98.98 0 0 0-.69-.28H6.54c-.77 0-1.4.56-1.49 1.28z"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M15 5.63 20.66 12 15 18.37V14h-1c-3.96 0-7.14 1-9.75 3.09 1.84-4.07 5.11-6.4 9.89-7.1l.86-.13V5.63M14 3v6C6.22 10.13 3.11 15.33 2 21c2.78-3.97 6.44-5.78 12-5.78V21l8-9-8-9z"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15-5-2.18L7 18V5h10v13z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  speed:'<svg viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>',

/* ---- local device state ----
   There is no server-side history endpoint, and adding a table for it was not
   worth the write cost on every play. So history, watch later and how far you
   got are kept on the device in localStorage, capped so they cannot grow
   without bound. Clearing them costs one key. */
function store(k, v){
  try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){}
}
function load(k, dflt){
  try{ var v = localStorage.getItem(k); return v === null ? dflt : JSON.parse(v); }
  catch(e){ return dflt; }
}
var seenMap = load(K_SEEN, {});
function setSeen(id, pct){ seenMap[id] = pct; store(K_SEEN, seenMap); }
function seenPct(id){ return seenMap[id] || 0; }
function watchedBefore(id){ return !!load(K_HIST, []).filter(function(h){ return h.id === id; }).length; }
var laterList = load(K_LATER, []);
function isLater(id){ return laterList.indexOf(id) >= 0; }
function toggleLater(id){
  var i = laterList.indexOf(id);
  if (i >= 0) laterList.splice(i, 1); else laterList.unshift(id);
  if (laterList.length > 300) laterList.length = 300;
  store(K_LATER, laterList);
  return i < 0;
}
var histList = load(K_HIST, []);
function pushHistory(v){
  if (!v || !v.id) return;
  histList = histList.filter(function(h){ return h.id !== v.id; });
  histList.unshift({ id:v.id, title:v.title, owner:v.owner, duration:v.duration, at:Date.now() });
  if (histList.length > 200) histList.length = 200;
  store(K_HIST, histList);
}
function playRateOf(){ return playRate || load(K_SPEED, 1) || 1; }
/* "Not interested" is a local hide list, the same way watch later is local.
   The API has no way to express it and inventing one for a list this small
   would be a table nobody reads. */
function hiddenIds(){ return load("ff_hidden", []); }
function hideVideo(id){
  var hid = hiddenIds();
  if (hid.indexOf(id) < 0) hid.push(id);
  if (hid.length > 500) hid.length = 500;
  store("ff_hidden", hid);
  // Drop it from the list on screen straight away rather than waiting for a refetch.
  var card = document.querySelector('.vcard[data-v="' + id + '"]');
  var wrap = card && card.closest(".vcard-wrap");
  if (wrap) wrap.remove();
}

function $(id){ return document.getElementById(id); }
function token(){ try{ return localStorage.getItem(K_TOKEN); }catch(e){ return null; } }
function isAdmin(){ return myRole === "admin"; }
function isStaff(){ return myRole === "admin" || myRole === "mod"; }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(n){
  n = Number(n)||0;
  if (n >= 1e9) return (n/1e9).toFixed(n<1e10?1:0).replace(/\.0$/,"")+"B views";
  if (n >= 1e6) return (n/1e6).toFixed(n<1e7?1:0).replace(/\.0$/,"")+"M views";
  if (n >= 1e3) return (n/1e3).toFixed(n<1e4?1:0).replace(/\.0$/,"")+"K views";
  return n + (n===1?" view":" views");
}
/* A bare count with no unit, for places like the like button. fmt() appends
   " view"/" views", and stripping that with a replace() silently failed on the
   singular form, which is how the button ended up reading "1 view". */
function num(n){
  n = Number(n)||0;
  if (n >= 1e9) return (n/1e9).toFixed(n<1e10?1:0).replace(/\.0$/,"")+"B";
  if (n >= 1e6) return (n/1e6).toFixed(n<1e7?1:0).replace(/\.0$/,"")+"M";
  if (n >= 1e3) return (n/1e3).toFixed(n<1e4?1:0).replace(/\.0$/,"")+"K";
  return String(n);
}
function ago(iso){
  if (!iso) return "";
  var t = new Date(iso).getTime();
  if (!t || isNaN(t)) return "";
  var s = Math.max(0,(Date.now()-t)/1000);
  if (s < 60) return "just now";
  // The hours branch used to divide by 60 and label the result "minutes", so
  // anything from an hour to a day old was printed as a total - a 2 hour old
  // video read "120 minutes ago". Each step now divides by its own span.
  if (s < 3600){ var m = Math.floor(s/60); return m+" minute"+(m===1?"":"s")+" ago"; }
  if (s < 86400){ var h = Math.floor(s/3600); return h+" hour"+(h===1?"":"s")+" ago"; }
  if (s < 172800) return "1 day ago";
  if (s < 2592000){ var d=Math.floor(s/86400); return d+" day"+(d===1?"":"s")+" ago"; }
  if (s < 31536000){ var mo=Math.floor(s/2592000); return mo+" month"+(mo===1?"":"s")+" ago"; }
  var y=Math.floor(s/31536000); return y+" year"+(y===1?"":"s")+" ago";
}
function dur(sec){
  sec = Math.floor(Number(sec)||0);
  if (!sec) return "";
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h?h+":":"" ) + (h? String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
}
/* The toast takes an optional action. Anything that removes something the user
   can no longer get back on its own, such as "Not interested", passes an Undo
   rather than just telling them what happened. */
function toast(msg, action, ms){
  var t = $("toast");
  clearTimeout(t._h);
  if (action){
    t.innerHTML = "";
    t.appendChild(document.createTextNode(msg));
    var b = document.createElement("button");
    b.className = "t-act"; b.textContent = action.label;
    b.onclick = function(){ t.classList.remove("on"); action.run(); };
    t.appendChild(b);
  } else {
    t.textContent = msg;
  }
  t.classList.add("on");
  t._h = setTimeout(function(){ t.classList.remove("on"); }, ms || (action ? 5000 : 2200));
}
function initials(n){ return String(n||"?").charAt(0).toUpperCase(); }

/* ---------- network ---------- */
function api(path, opts){
  opts = opts || {};
  var h = { "Content-Type": "application/json" };
  if (token()) h.Authorization = "Bearer " + token();
  return fetch(API + path, {
    method: opts.method || "GET", headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) {
        var e = new Error(j.error || ("Request failed (" + r.status + ")"));
        e.status = r.status; e.body = j; throw e;
      }
      return j;
    });
  });
}
function mediaUrl(kind, id){
  var u = API + (kind === "v" ? "/v/" : "/t/") + encodeURIComponent(id);
  if (token()) u += "?token=" + encodeURIComponent(token());
  return u;
}

/* ---------- session ---------- */
function setSession(j){
  me = j.username; myRole = j.role || "user";
  try{
    localStorage.setItem(K_USER, me); localStorage.setItem(K_ROLE, myRole);
    if (j.token) localStorage.setItem(K_TOKEN, j.token);
  }catch(e){}
  paintAvatar(); loadMyReports();
}
function clearSession(){
  me = null; myRole = "user";
  try{ localStorage.removeItem(K_USER); localStorage.removeItem(K_ROLE); localStorage.removeItem(K_TOKEN); }catch(e){}
  paintAvatar();
}
function paintAvatar(){
  var b = $("avatarBtn");
  b.textContent = me ? initials(me) : "?";
  b.className = me ? "me" : "";
  $("notifBtn").classList.toggle("hidden", !me);
  // Ask the server for the unread count rather than guessing. Before this, the
  // dot was unconditionally hidden here, so it could never turn on.
  if (me) refreshUnread(); else $("notifDot").classList.add("hidden");
}

/* =====================================================================
   BAN SCREEN
   A ban is a dead end, not a toast. This covers the app and says what
   happened, who did it and when, then offers the appeal form inline.

   The appeal token is only ever minted on a *rejected* login, and
   /api/me does not return one. So a person who was signed in when they
   were banned has no token: the form asks for their password, proves it,
   and the 403 carries the token they need. Someone who was just banned at
   the sign-in sheet already has one, so the field is skipped for them.
   ===================================================================== */
function showBan(ban, tokenFromLogin){
  var b = $("ban");
  var needPw = !tokenFromLogin;

  function send(){
    var ta = $("appealTa"), pw = $("appealPw"), msg = $("appealMsg"), btn = $("appealSend");
    var text = (ta.value || "").trim();
    if (text.length < 10) { msg.textContent = "Please write at least 10 characters."; msg.className = "sheet-msg"; return; }
    if (needPw && (!pw || pw.value.length < 4)) { msg.textContent = "Enter your password so we can verify the account."; msg.className = "sheet-msg"; return; }
    btn.disabled = true; msg.textContent = "Sending..."; msg.className = "sheet-msg";
    // Re-login deliberately: the password is checked first, so a wrong guess
    // cannot be used to probe whether someone is banned.
    fetch(API + "/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: ban.username, password: needPw ? pw.value : "" })
    })
      .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j }; }); })
      .then(function(x){
        if (x.status === 401) throw new Error("That password is not right.");
        var tok = x.j.appealToken || tokenFromLogin;
        if (!tok) throw new Error(x.j.error || "Could not start an appeal. Try again in a moment.");
        return api("/api/appeal", { method: "POST", body: { appealToken: tok, message: text } });
      })
      .then(function(){
        msg.textContent = "Appeal sent. A moderator will review it.";
        msg.className = "sheet-msg ok"; btn.disabled = true; ta.value = ""; ta.disabled = true;
        if (pw) { pw.value = ""; pw.disabled = true; }
      })
      .catch(function(e){
        msg.textContent = e.message || "Could not send that appeal.";
        msg.className = "sheet-msg"; btn.disabled = false;
      });
  }

  b.innerHTML =
    '<div class="bx">' +
      '<h1>BANNED</h1>' +
      '<div class="sub">FirFall account review</div>' +
      '<table>' +
        '<tr><td>Account</td><td>@' + esc(ban.username||"?") + '</td></tr>' +
        '<tr><td>Reason</td><td>' + esc(ban.reason||"Not stated") + '</td></tr>' +
        '<tr><td>Reviewed by</td><td>' + esc(ban.bannedBy||"FirFall moderators") + '</td></tr>' +
        '<tr><td>Date</td><td>' + esc(ban.bannedAt ? new Date(ban.bannedAt).toUTCString() : "Not stated") + '</td></tr>' +
      '</table>' +
      '<p>This account was reviewed and banned by FirFall moderators. If you believe this is a mistake, appeal below and a moderator will look at it.</p>' +
      (needPw ? '<input id="appealPw" type="password" placeholder="Your password" autocomplete="current-password" ' +
        'style="width:100%;background:#2a2a2a;border:1px solid #444;border-radius:6px;color:#fff;padding:10px;font:inherit;font-size:14px;margin-bottom:10px">' : '') +
      '<textarea id="appealTa" rows="3" maxlength="1000" placeholder="Tell the moderators what happened (at least 10 characters)" ' +
        'style="width:100%;background:#2a2a2a;border:1px solid #444;border-radius:6px;color:#fff;padding:10px;font:inherit;font-size:14px;margin-bottom:10px"></textarea>' +
      '<div id="appealMsg" class="sheet-msg"></div>' +
      '<button id="appealSend" class="bg2" style="margin-top:10px">Send appeal</button>' +
      '<button class="bgl" id="banSignOut">Sign out</button>' +
    '</div>';
  b.classList.remove("hidden");
  $("appealSend").onclick = send;
  $("banSignOut").onclick = signOut;
}
function hideBan(){ $("ban").classList.add("hidden"); }
function signOut(){
  clearSession(); hideBan(); closeSheet();
  go("home"); toast("Signed out");
}

/* =====================================================================
   SHEET (bottom sheet used for report, sign in, upload note)
   ===================================================================== */
function openSheet(html){
  $("sheetBody").innerHTML = html;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  $("main").style.pointerEvents = "none";
}
function closeSheet(){
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
  $("main").style.pointerEvents = "";
}
$("scrim").onclick = closeSheet;

/* ---------- auth sheet ---------- */
function authSheet(mode){
  var reg = mode === "register";
  openSheet(
    '<div id="sheetTitle">' + (reg?"Create account":"Sign in") + '</div>' +
    '<div id="sheetSub">' + (reg ? "Pick a name. It becomes your channel." : "Welcome back to FirFall.") + '</div>' +
    '<div class="field"><label>Username</label><input id="auUser" autocapitalize="none" autocomplete="username"></div>' +
    '<div class="field"><label>Password</label><input id="auPass" type="password" autocomplete="' + (reg?"new-password":"current-password") + '"></div>' +
    '<div class="sheet-msg" id="auMsg"></div>' +
    '<button class="sheet-go" id="auGo">' + (reg?"Create":"Sign in") + '</button>' +
    '<div class="sheet-alt">' + (reg ? "Have an account?" : "New to FirFall?") +
      ' <button id="auSwap">' + (reg ? "Sign in" : "Create one") + '</button></div>'
  );
  function submit(){
    var u = ($("auUser").value||"").trim().toLowerCase();
    var p = $("auPass").value||"";
    var msg = $("auMsg"), btn = $("auGo");
    if (!/^[a-z0-9_]{3,20}$/.test(u)) { msg.textContent = "Username must be 3-20 characters: a-z, 0-9, underscore."; return; }
    if (p.length < 4) { msg.textContent = "Password must be at least 4 characters."; return; }
    btn.disabled = true; msg.textContent = reg ? "Creating..." : "Signing in...";
    api(reg ? "/api/register" : "/api/login", { method:"POST", body:{ username:u, password:p } })
      .then(function(j){
        setSession(j); closeSheet(); toast(reg ? "Welcome to FirFall, @" + j.username : "Signed in as @" + j.username);
        go(curTab, true);
      })
      .catch(function(e){
        // A ban arrives as a 403 carrying the appeal token. Show the ban screen
        // instead of a bare error line, and hand the token over so the person
        // does not have to retype their password to appeal.
        if (e.status === 403 && e.body && e.body.banned) {
          closeSheet(); clearSession();
          showBan({
            username: e.body.username, reason: e.body.ban && e.body.ban.reason,
            bannedBy: e.body.ban && e.body.ban.bannedBy, bannedAt: e.body.ban && e.body.ban.bannedAt
          }, e.body.appealToken);
          return;
        }
        msg.textContent = e.message || "That did not work.";
        btn.disabled = false;
      });
  }
  $("auGo").onclick = submit;
  $("auSwap").onclick = function(){ closeSheet(); setTimeout(function(){ authSheet(reg?"login":"register"); }, 180); };
  $("auPass").onkeydown = function(e){ if (e.key === "Enter") submit(); };
}

/* ---------- report sheet ---------- */
var REASONS = [["spam","Spam"],["harassment","Harassment"],["hate","Hate speech"],
               ["sexual","Sexual"],["violence","Violence"],["scam","Scam"],["other","Other"]];
function reportSheet(kind, id, label){
  if (!me) { authSheet("login"); return; }
  var key = kind + ":" + id;
  if (myReports[key]) { toast("You already reported this."); return; }
  var chosen = "other";
  openSheet(
    '<div id="sheetTitle">Report ' + (kind==="video"?"video":"comment") + '</div>' +
    '<div id="sheetSub">' + esc(label||"") + '</div>' +
    '<div class="why" id="whyRow">' +
      REASONS.map(function(r){ return '<button data-v="'+r[0]+'"' + (r[0]==="other"?' class="on"':'') + '>'+r[1]+'</button>'; }).join("") +
    '</div>' +
    '<textarea id="rpTa" maxlength="500" placeholder="Anything else the moderators should know? (optional)"></textarea>' +
    '<div class="sheet-msg" id="rpMsg"></div>' +
    '<button class="sheet-go" id="rpGo">Send report</button>'
  );
  Array.prototype.forEach.call($("whyRow").children, function(b){
    b.onclick = function(){
      chosen = b.dataset.v;
      Array.prototype.forEach.call($("whyRow").children, function(x){ x.classList.remove("on"); });
      b.classList.add("on");
    };
  });
  $("rpGo").onclick = function(){
    var btn = $("rpGo"), msg = $("rpMsg");
    btn.disabled = true; msg.textContent = "Sending...";
    api("/api/report", { method:"POST", body:{ kind:kind, id:id, reason:chosen, detail:$("rpTa").value } })
      .then(function(){
        myReports[key] = "open";
        try{ localStorage.setItem(K_MYREP, JSON.stringify(myReports)); }catch(e){}
        markReported(kind, id);
        msg.textContent = "Sent. Thank you."; msg.className = "sheet-msg ok";
        setTimeout(function(){ closeSheet(); toast("Report sent to the moderators"); }, 900);
      })
      .catch(function(e){
        if (e.status === 409) { myReports[key] = "open"; markReported(kind, id); }
        msg.textContent = e.message || "Could not send that."; msg.className = "sheet-msg"; btn.disabled = false;
      });
  };
}
function markReported(kind, id){
  Array.prototype.forEach.call(document.querySelectorAll('.rbtn[data-k="'+kind+'"][data-i="'+id+'"]'), function(b){
    b.textContent = "Reported"; b.disabled = true; b.style.opacity = ".45";
  });
}
function loadMyReports(){
  if (!me) return;
  api("/api/reports/mine").then(function(j){
    (j.reported||[]).forEach(function(s){
      var p = s.split(":"); if (p.length >= 2) myReports[p[0]+":"+p[1]] = p[2];
    });
  }).catch(function(){});
}

/* =====================================================================
   SHARE / SPEED / OVERFLOW
   ===================================================================== */
/* On a device this hands off to the Android share sheet. In a browser there is
   no such bridge, so it falls back to the clipboard and then to a selectable
   prompt, rather than silently doing nothing. */
function shareVideo(v, btn){
  var url = location.origin + "/watch?v=" + encodeURIComponent(v.id);
  var text = v.title + " on FirFall\n" + url;
  var bridge = window.FirFallNative;
  function copied(){
    if (btn) btn.innerHTML = ICON.check + "Copied";
    setTimeout(function(){ if (btn && document.body.contains(btn)) btn.innerHTML = ICON.share + "Share"; }, 1600);
  }
  if (bridge && typeof bridge.share === "function") {
    try { bridge.share(v.title, text); return; } catch(e){}
  }
  if (navigator.share) {
    navigator.share({ title: v.title, url: url }).catch(function(){});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(copied).catch(function(){ promptFallback(url); });
  } else promptFallback(url);
}
function promptFallback(url){
  openSheet('<div id="sheetTitle">Share this video</div>' +
    '<div id="sheetSub">Copy the link below.</div>' +
    '<input id="shareUrl" class="share-url" readonly value="' + esc(url) + '">' +
    '<button class="sheet-go" id="shareOk">Done</button>');
  var i = $("shareUrl");
  i.onclick = function(){ i.select(); };
  $("shareOk").onclick = closeSheet;
}
/* Playback speed. The sheet is built from a list rather than six hard-coded
   buttons so the rate list stays in one place. */
var RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
function speedSheet(v){
  var cur = playRateOf();
  openSheet(
    '<div id="sheetTitle">Playback speed</div>' +
    '<div id="sheetSub">' + esc(v.title) + '</div>' +
    '<div class="why" id="rateRow">' + RATES.map(function(r){
      return '<button data-r="' + r + '"' + (r === cur ? ' class="on"' : '') + '>' +
        (r === 1 ? "Normal" : r + "x") + '</button>';
    }).join("") + '</div>'
  );
  Array.prototype.forEach.call($("rateRow").querySelectorAll("button"), function(b){
    b.onclick = function(){
      var r = parseFloat(b.dataset.r);
      playRate = r; store(K_SPEED, r);
      if (player) { try{ player.playRate = r; }catch(e){} }
      var lbl = $("speedLbl");
      if (lbl) lbl.textContent = r === 1 ? "Speed" : r + "x";
      closeSheet();
      toast(r === 1 ? "Normal speed" : "Speed set to " + r + "x");
    };
  });
}
/* The overflow menu behind the three dots on a feed card. Report moved in here
   from its own button: it is the item people look for under "..." on YouTube,
   and a permanent red pill on every card was the least YouTube-like thing in
   the whole app. */
function overflowMenu(kind, id, anchor, label){
  var v = { id: id, title: label || (anchor ? anchor.querySelector(".vtitle").textContent : "this video") };
  var saved = kind === "video" && isLater(id);
  var rows = [];
  if (kind === "video") {
    rows.push(['later', ICON.save, saved ? "Remove from Watch later" : "Save to Watch later", function(){
      var now = toggleLater(id);
      toast(now ? "Saved to Watch later" : "Removed from Watch later");
    }]);
    rows.push(['share', ICON.share, "Share", function(){ shareVideo(v); }]);
  }
  rows.push(['notint', ICON.more, "Not interested", function(){
    hideVideo(id);
    toast("Video hidden", { label: "Undo", run: function(){
      var hid = load("ff_hidden", []);
      hid = hid.filter(function(x){ return x !== id; });
      store("ff_hidden", hid);
      if (curTab === "home") loadHome();
    }});
  }]);
  if (!me) rows.push(['signin', ICON.more, "Sign in to report", function(){ authSheet("login"); }]);
  else if (myReports[kind + ":" + id]) rows.push(['done', ICON.check, "Reported", function(){}]);
  else rows.push(['report', ICON.flag, "Report", function(){ reportSheet(kind, id, v.title); }]);

  openSheet('<div id="sheetTitle">' + (kind==="video" ? "Video options" : "Comment options") + '</div>' +
    '<div id="sheetSub">' + esc(v.title) + '</div>' +
    '<div class="menu">' + rows.map(function(r){
      return '<button data-m="' + r[0] + '">' + r[1] + '<span>' + r[2] + '</span></button>';
    }).join("") + '</div>');
  // openSheet writes into #sheetBody, which is a sibling of #scrim, not a
  // child of it. Selecting under #scrim found nothing, so the rows rendered
  // but did nothing when tapped.
  Array.prototype.forEach.call($("sheetBody").querySelectorAll(".menu button"), function(b){
    b.onclick = function(){
      var row = rows.filter(function(r){ return r[0] === b.dataset.m; })[0];
      closeSheet();
      if (row) row[3]();
    };
  });
}

/* =====================================================================
   TAB ROUTER
   ===================================================================== */
// Every tab the router will accept. "embers" was missing from this list, and
// go() starts with "if (!TABS[tab]) return;" - so pressing the Embers button
// returned immediately and buildEmbers() was never reached. The button looked
// fine and did nothing at all, in the browser and in the app alike.
var TABS = { home:1, embers:1, subs:1, you:1, channel:1, watch:1, search:1, library:1, notifs:1, create:1 };
/* Which bottom-nav item stays lit while you are inside a pushed screen. YouTube
   keeps the origin tab highlighted when you open a video or a channel from it. */
var NAV_OWNER = { watch:null, channel:null, search:null, notifs:null, create:null, library:null };
var navOrigin = "home";
function go(tab, force){
  if (!TABS[tab]) return;
  if (curTab === tab && !force) { $("main").scrollTo(0,0); return; }
  if (NAV_OWNER[tab] === null) navOrigin = navOrigin || "home";
  curTab = tab;
  // Shorts used to take over the whole viewport and hide #main, and nothing
  // ever took it back, so the app went permanently black after one visit. #main
  // is now the only scrolling surface and is never hidden.
  document.querySelectorAll(".nitem").forEach(function(n){
    var t = n.dataset.tab;
    n.classList.toggle("on", t === tab || (NAV_OWNER[tab] === null && t === navOrigin));
  });
  $("searchWrap").classList.remove("on");
  $("chips").classList.toggle("hidden", !(tab==="home"||tab==="subs"));
  $("main").scrollTop = 0;
  ["feed","watch","channel","library","search","you","notifs"].forEach(function(id){ $(id).classList.add("hidden"); });
  if (tab !== "watch" && player) { player.pause(); player.removeAttribute("src"); player = null; }

  if (tab === "home")      return loadHome();
  if (tab === "embers")    return buildEmbers();
  if (tab === "subs")      return loadSubs();
  if (tab === "you")       return loadYou();
  if (tab === "library")   return loadLibrary();
  if (tab === "search")    return doSearch(searchQ);
  if (tab === "channel")   return loadChannel(curChannel);
  if (tab === "watch")     return loadWatch(curVideo);
  if (tab === "notifs")    return loadNotifs();
  if (tab === "create")    return createNote();
}

document.querySelectorAll(".nitem").forEach(function(n){
  n.onclick = function(){ tab(n.dataset.tab); };
});
function tab(t){
  if (t === "create") { createNote(); return; }
  if (t === "embers") { curChannel = null; curVideo = null; go("embers", true); paintChips(); return; }
  curChannel = null; curVideo = null; go(t, true);
  paintChips();
}

/* =====================================================================
   HOME
   ===================================================================== */
var PAGE = 12;
function paintChips(){
  var row = $("chips"); row.innerHTML = "";
  if (curTab === "subs") {
    row.innerHTML = '<span class="chip-sub">' + esc(me ? "@" + me.username : "") + '</span>';
    return;
  }
  // The chips row is hidden outside Home and Subscriptions, so there is
  // nothing to paint here. Embers has its own order in buildEmbers().
  if (curTab !== "home") return;
  // Sort chips actually reorder the server query. The old "Latest" chip only
  // re-sorted an already-fetched list, so it could never do anything the
  // default was not already doing.
  [ ["new","Latest"], ["popular","Popular"], ["old","Oldest"] ].forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip" + (feedSort === c[0] ? " on" : "");
    b.textContent = c[1];
    b.onclick = function(){ feedSort = c[0]; loadHome(); };
    row.appendChild(b);
  });
}
/* =====================================================================
   EMBERS
   ===================================================================== */
async function buildEmbers(){
  show("feed"); 
  // Vertical cards for this tab only; every other feed removes the class.
  $("feed").classList.add("vgrid");
  $("feed").innerHTML = '<div class="spin" style="padding:80px 0"></div>';
  try{
    var j = await api("/api/videos?kind=ember&limit=50");
    var vs = j.videos || [];
    if (!vs.length) {
      $("feed").innerHTML = '<div class="empty" style="padding-top:120px"><div class="big">No embers</div>' +
        'No vertical clips have been uploaded yet.</div>';
      return;
    }
    renderFeed(vs, "No embers yet.");
  }catch(e){
    $("feed").innerHTML = '<div class="empty" style="padding-top:120px">' + esc(e.message||"Could not load embers.") + '</div>';
  }
}
async function loadHome(append){
  show("feed"); paintChips();
  if (!append) {
    $("feed").innerHTML = '<div class="spin" style="padding:40px 0"></div>';
  }
  if (feedLoading) return;
  feedLoading = true;
  try{
    var owner = (curTab === "subs" && me) ? await subsFeedOwner() : null;
    // Embers are vertical and live in their own tab. Every feed meant to hold
    // ordinary videos says kind=video explicitly: the API treats a missing
    // kind as "both", which is how vertical clips ended up in the normal grid.
    var url = "/api/videos?kind=video&limit=" + PAGE + "&offset=" + (append ? feedOffset : 0) + "&sort=" + feedSort;
    if (owner) url += "&owner=" + encodeURIComponent(owner);
    var j = await api(url);
    var vs = j.videos || [];
    if (curTab === "subs" && me) {
      var names = await subChannels();
      var all = [];
      for (var i=0;i<names.length;i++){
        var r = await api("/api/videos?kind=video&owner=" + encodeURIComponent(names[i]));
        all = all.concat(r.videos || []);
      }
      all.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
      vs = all;
    }
    if (curTab !== "subs") { feedOffset += vs.length; feedTotal = (j.total == null ? vs.length : j.total); }
    // Apply the local hide list to the feed only. A channel page and a search
    // result are places you asked for by name, so hiding there would be wrong.
    if (curTab === "home") {
      var hid = hiddenIds();
      if (hid.length) vs = vs.filter(function(v){ return hid.indexOf(v.id) < 0; });
    }
    renderFeed(vs, curTab === "subs" && me
      ? "You have not subscribed to any channels yet. Open a channel and press Subscribe."
      : "No videos yet. Upload one from the FirFall website.", append);
  }catch(e){ fail(e); }
  finally { feedLoading = false; }
}
async function subsFeedOwner(){ return null; }
async function subChannels(){
  try{ var j = await api("/api/subscriptions"); return (j.subscriptions||[]).map(function(s){ return s.channel; }); }
  catch(e){ return []; }
}
function show(id){
  ["feed","watch","channel","library","search","you","notifs"].forEach(function(x){ $(x).classList.add("hidden"); });
  $(id).classList.remove("hidden");
  // The vertical card grid belongs to the Embers tab and nowhere else, and
  // every feed shares this one container - so it is cleared here rather than
  // in each loader, and a later tab cannot inherit a grid it did not ask for.
  if (!(id === "feed" && curTab === "embers")) $("feed").classList.remove("vgrid");
}
function fail(e){
  $("feed").innerHTML = '<div class="empty"><div class="big">!</div>' +
    esc(e && e.message ? e.message : "Could not reach FirFall.") + '</div>';
  $("feed").classList.remove("hidden");
}
function progressOf(id){ return seenPct(id); }
function vcard(v){
  var d = v.duration ? '<span class="dur">' + dur(v.duration) + '</span>' : "";
  var p = progressOf(v.id);
  var seen = p > 0 ? '<span class="seen" style="width:' + p + '%"></span>' : "";
  var watched = p >= 95 || p === 0 && watchedBefore(v.id);
  return '<div class="vcard-wrap"><button class="vcard" data-v="' + esc(v.id) + '">' +
    '<div class="thumb">' +
      '<div class="ph"><span>' + esc(initials(v.owner)) + '</span></div>' +
      '<img loading="lazy" alt="" src="' + esc(mediaUrl("t", v.id)) + '" ' +
        'onload="this.style.display=\'block\';this.previousElementSibling.style.display=\'none\'" ' +
        'onerror="this.style.display=\'none\'">' + d + seen +
    '</div>' +
    '<div class="vmeta"><div class="vav">' + esc(initials(v.owner)) + '</div><div class="vtext">' +
      '<div class="vtitle' + (watched ? " seen-t" : "") + '">' + esc(v.title) + '</div>' +
      '<div class="vsub"><span>@' + esc(v.owner) + '</span><span class="dot"></span>' +
        '<span>' + esc(fmt(v.views)) + '</span><span class="dot"></span><span>' + esc(ago(v.created_at)) + '</span></div>' +
    '</div></div></button>' +
    '<button class="kebab" data-k="' + esc(v.id) + '" aria-label="More">' + ICON.kebab + '</button>' +
  '</div>';
}
function renderFeed(vs, emptyMsg, append){
  var feed = $("feed");
  // Kept so a tap on a card can ask "is this an ember?" - the Shorts viewer
  // needs the whole list, not just the card, so you can swipe past it.
  if (!append) curFeedList = vs; else curFeedList = curFeedList.concat(vs);
  if (!vs.length && !append) {
    feed.innerHTML = '<div class="empty"><div class="big"></div></div>';
    feed.querySelector(".big").textContent = emptyMsg || "Nothing here";
    return;
  }
  feed.insertAdjacentHTML("beforeend", vs.map(vcard).join(""));
  Array.prototype.forEach.call(feed.querySelectorAll(".vcard"), function(b){
    b.onclick = function(){
      var v = feedVideoById(b.dataset.v);
      // An ember opens in the full-screen vertical player. Everything else
      // opens on the watch page.
      if (v && v.kind === "ember") { openShorts(curFeedList, v.id); return; }
      curVideo = b.dataset.v; go("watch", true);
    };
  });
  Array.prototype.forEach.call(feed.querySelectorAll(".kebab"), function(b){
    b.onclick = function(ev){ ev.stopPropagation(); overflowMenu("video", b.dataset.k, b.closest(".vcard-wrap")); };
  });
  if (append) { var w = $("feedMore"); if (w) w.remove(); }
  // The spinner at the bottom is what loadMore watches for.
  if (curTab === "home" && feedTotal != null && feedOffset < feedTotal)
    feed.insertAdjacentHTML("beforeend", '<div id="feedMore" class="spin spin-foot"></div>');
  else if (curTab === "home")
    feed.insertAdjacentHTML("beforeend", '<div class="feed-end">You have reached the end</div>');
}

/* =====================================================================
   WATCH
   ===================================================================== */
async function loadWatch(id){
  show("watch");
  $("watch").innerHTML = '<div class="spin" style="padding:60px 0"></div>';
  var v;
  try{
    var j = await api("/api/video?id=" + encodeURIComponent(id));
    v = j.video;
    window._watch = { likes: j.likes||0, reaction: j.reaction||"none" };
  }catch(e){
    $("watch").innerHTML = '<div class="empty"><div class="big">' + esc(e.message||"Video not found") + '</div>' +
      '<button class="act" style="margin-top:14px" onclick="go(\'home\',true)">Back home</button></div>';
    return;
  }
  // Any route to an ember - a link, the history list, a search result - lands
  // in the full-screen vertical player instead of the landscape watch page.
  // watchPlain is the comment button inside the player, which asked for the
  // full page on purpose; the flag is consumed either way.
  if (v.kind === "ember" && !watchPlain) { watchPlain = false; openShorts(null, v.id); return; }
  watchPlain = false;
  api("/api/video/view", { method:"POST", body:{ id: v.id } }).catch(function(){});
  var w = window._watch;
  var mine = me && v.owner === me;
  var sub = subState[v.owner];

  // Embers are vertical, so they get the 9:16 player box. A landscape ember
  // still plays whole inside it - see #playerBox.vert.
  var vert = v.kind === "ember";
  $("watch").innerHTML =
    '<div id="playerBox' + (vert ? ' vert' : '') + '"><video id="vp" controls playsinline preload="metadata" ' +
        'poster="' + esc(mediaUrl("t", v.id)) + '"></video>' +
      '<div id="pfab" class="hidden">HD</div></div>' +
    '<div class="watch-body">' +
      '<div class="wtitle">' + esc(v.title) +
        (v.owner_role === "mod" || v.owner_role === "admin" ? '<span class="badge-mod" style="background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:8px">MOD</span>' : "") +
      '</div>' +
      '<div class="wchan">' +
        '<button class="vav" data-ch="' + esc(v.owner) + '" style="width:40px;height:40px;font-size:16px">' + esc(initials(v.owner)) + '</button>' +
        '<div style="min-width:0;flex:1">' +
          '<div class="wcname" data-ch="' + esc(v.owner) + '">@' + esc(v.owner) + '</div>' +
          '<div class="wcsub" id="chSub"></div>' +
        '</div>' +
        (mine ? '' : '<button class="sub-btn' + (sub&&sub.subscribed?" on":"") + '" id="subBtn">'
              + (sub&&sub.subscribed?"Subscribed":"Subscribe") + '</button>') +
      '</div>' +
      '<div class="wacts">' +
        '<button class="act' + (w.reaction==="like"?" on":"") + '" id="likeBtn">' + ICON.like + (w.likes?num(w.likes):"Like") + '</button>' +
        '<button class="act' + (w.reaction==="dislike"?" on":"") + '" id="dislikeBtn">' + ICON.dislike + 'Dislike</button>' +
        '<div class="act-div"></div>' +
        '<button class="act" id="shareBtn">' + ICON.share + 'Share</button>' +
        '<button class="act' + (isLater(v.id)?" on":"") + '" id="saveBtn">' + (isLater(v.id)?ICON.check:ICON.save) + (isLater(v.id)?"Saved":"Save") + '</button>' +
        '<button class="act speed-btn" id="speedBtn">' + ICON.speed + '<span id="speedLbl">' + (playRate===1?"Speed":playRate+"x") + '</span></button>' +
        '<button class="act" id="moreBtn">' + ICON.more + 'More</button>' +
      '</div>' +
      '<div class="desc clamp" id="descBox">' +
        '<div class="dmeta">' + esc(fmt(v.views)) + ' &middot; ' + esc(ago(v.created_at)) + (v.duration?" &middot; "+esc(dur(v.duration)):"") + '</div>' +
        (v.description ? esc(v.description) : "<i>No description</i>") +
        '<span class="dmore">...more</span>' +
      '</div>' +
      '<h3 class="sect-h">Comments</h3>' +
      (me ? '<div class="cadd"><div class="cav vav">' + esc(initials(me)) + '</div>' +
            '<textarea id="cInput" rows="1" maxlength="500" placeholder="Add a comment..."></textarea>' +
            '<button class="cbtn" id="cSend">Comment</button></div>'
          : '<div class="cadd" style="padding-bottom:20px"><button class="act" id="cSignin">Sign in to comment</button></div>') +
      '<div id="cList"></div>' +
      '<div id="upNext"></div>' +
    '</div>';

  player = $("vp");
  player.src = mediaUrl("v", v.id);
  player.playRate = playRateOf();
  player.addEventListener("loadedmetadata", function(){
    if (!v.duration && player.duration && isFinite(player.duration)) {
      var el = $("descBox");
      if (el) el.querySelector(".dmeta").innerHTML = el.querySelector(".dmeta").innerHTML + " &middot; " + dur(player.duration);
    }
  });
  // Remember how far you got, and mark it watched near the end, so the feed can
  // show a red progress bar and grey out what you have already seen.
  player.addEventListener("timeupdate", function(){
    if (!player.duration || !isFinite(player.duration)) return;
    setSeen(v.id, Math.round(player.currentTime / player.duration * 100));
  });
  player.addEventListener("ended", function(){
    setSeen(v.id, 100);
    loadComments(v.id);
  });
  pushHistory({ id: v.id, title: v.title, owner: v.owner, duration: v.duration });

  /* Double tap to seek. A single tap is left to the native controls so pause
     and the scrubber still work; only two taps inside the player seek, and the
     left third goes back while the right two thirds go forward, which is where
     people reach for it. */
  var lastTap = 0, tapTimer = null;
  $("playerBox").addEventListener("click", function(e){
    var now = Date.now();
    if (now - lastTap > 320) { lastTap = now; return; }   // first tap: let the controls have it
    lastTap = 0;
    var box = this.getBoundingClientRect();
    var fwd = (e.clientX - box.left) / box.width > 0.33;
    if (player.duration) {
      player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + (fwd ? 10 : -10)));
    }

  });
  function seekBubble(fwd){

  else refreshSub(v.owner);

  var sb = $("subBtn");
  if (sb) sb.onclick = function(){
    if (!me) { authSheet("login"); return; }
    sb.disabled = true;
    api("/api/subscribe", { method:"POST", body:{ channel: v.owner, action: subState[v.owner].subscribed ? "unsub" : "sub" } })
      .then(function(j){

        sb.classList.toggle("on", !!j.subscribed);
        $("chSub").textContent = num(j.subscribers||0) + " subscriber" + (j.subscribers===1?"":"s");
        toast(j.subscribed ? "Subscribed to @" + v.owner : "Unsubscribed");
      })
      .catch(function(e){ toast(e.message || "Could not subscribe."); })
      .then(function(){ sb.disabled = false; });
  };
  var lb = $("likeBtn"), db = $("dislikeBtn");
  function react(kind){
    if (!me) { authSheet("login"); return; }
    api("/api/video/react", { method:"POST", body:{ id: v.id, kind: kind } })
      .then(function(j){
        w.likes = j.likes; w.reaction = j.reaction;
        lb.classList.toggle("on", j.reaction === "like");
        db.classList.toggle("on", j.reaction === "dislike");
        lb.innerHTML = ICON.like + (j.likes?num(j.likes):"Like");
      })
      .catch(function(e){ toast(e.message || "Could not save that."); });
  }
  lb.onclick = function(){ react(w.reaction === "like" ? "none" : "like"); };
  db.onclick = function(){ react(w.reaction === "dislike" ? "none" : "dislike"); };

  $("shareBtn").onclick = function(){ shareVideo(v, this); };
  var svb = $("saveBtn");
  svb.onclick = function(){
    var now = toggleLater(v.id);
    svb.classList.toggle("on", now);
    svb.innerHTML = (now ? ICON.check : ICON.save) + (now ? "Saved" : "Save");
    toast(now ? "Saved to Watch later" : "Removed from Watch later");
  };
  $("speedBtn").onclick = function(){ speedSheet(v); };
  $("moreBtn").onclick = function(){ overflowMenu("video", v.id, null, v.title); };

  // The description is collapsed to two lines and expands on tap, like the
  // YouTube watch page. The "...more" marker only shows when there is more.
  var dbx = $("descBox");
  function syncDesc(){
    var clamped = dbx.classList.contains("clamp");
    var more = dbx.querySelector(".dmore");
    if (clamped) { dbx.classList.remove("clamp"); if (more) more.textContent = "Show less"; }
    else { dbx.classList.add("clamp"); if (more) more.textContent = "...more"; }
  }
  dbx.addEventListener("click", syncDesc);
  dbx.classList.add("clamp");
  if ($("cSignin")) $("cSignin").onclick = function(){ authSheet("login"); };

  var ta = $("cInput");
  if (ta) {
    ta.addEventListener("input", function(){

    });
    $("cSend").onclick = function(){
      var t = ta.value.trim();
      if (!t) return;
      api("/api/comments", { method:"POST", body:{ video_id: v.id, text: t } })
        .then(function(){ ta.value = ""; ta.style.height = "auto"; $("cSend").classList.remove("go");
                          toast("Comment posted"); loadComments(v.id); })
        .catch(function(e){ toast(e.message || "Could not post that."); });

  }
  loadComments(v.id);

}
/* Up next: more from the same channel, then anything else from the feed.
   It is the one place a phone app really earns its keep after the video
   ends, because there is no "keep scrolling" affordance on a watch page. */
function loadUpNext(v){
  var box = $("upNext");
  if (!box) return;
  api("/api/videos?kind=video&owner=" + encodeURIComponent(v.owner)).then(function(j){
    var mine = (j.videos || []).filter(function(x){ return x.id !== v.id; }).slice(0, 6);
    return api("/api/videos?kind=video&limit=20").then(function(f){
      var hid = hiddenIds();
      var others = (f.videos || []).filter(function(x){
        return x.id !== v.id && x.owner !== v.owner && hid.indexOf(x.id) < 0;
      }).slice(0, mine.length ? 4 : 12);
      return { mine: mine, others: others };
    });
  }).then(function(r){
    if (!r.mine.length && !r.others.length) { box.innerHTML = ""; return; }
    var head = r.mine.length
      ? '<h3 class="sect-h">More from this channel</h3>'
      : '<h3 class="sect-h">Up next</h3>';
    var body = (r.mine.length ? r.mine : r.others).map(vcard).join("");
    var tail = r.mine.length && r.others.length
      ? '<h3 class="sect-h">Up next</h3>' + r.others.map(vcard).join("") : "";
    box.innerHTML = head + body + tail;
    Array.prototype.forEach.call(box.querySelectorAll(".vcard"), function(b){
      b.onclick = function(){ curVideo = b.dataset.v; go("watch", true); };
    });
    Array.prototype.forEach.call(box.querySelectorAll(".kebab"), function(b){
      b.onclick = function(ev){ ev.stopPropagation(); overflowMenu("video", b.dataset.k, b.closest(".vcard-wrap")); };
    });
  }).catch(function(){ /* Up next is a nicety; never let it break the page. */ });
}
function refreshSub(channel){
  api("/api/substatus?channel=" + encodeURIComponent(channel))
    .then(function(j){ subState[channel] = j; var el = $("chSub"); if (el) el.textContent = num(j.subscribers||0) + " subscriber" + (j.subscribers===1?"":"s"); })
    .catch(function(){});
}
/* target defaults to the watch page's list; the Shorts panel passes its own so
   the same renderer and the same report buttons serve both. */
function loadComments(vid, target){
  api("/api/comments?video=" + encodeURIComponent(vid)).then(function(j){
    var list = target || $("cList"); if (!list) return;
    var cs = j.comments || [];
