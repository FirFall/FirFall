/* =====================================================================
   EMBERS: record / pick / upload
   =====================================================================
   A phone page can do all of this in-band: getUserMedia + MediaRecorder are
   standard, and the API's chunked upload protocol is just fetch calls. The
   60 second cap is enforced twice - the recorder stops itself, and the
   worker re-checks the reported duration, so a long clip cannot slip in by
   lying about its length. */
var EMBER_MAX_S = 60;
var camStream = null, camRec = null, camChunks = [], camTimerIv = null;
var camFacing = "user", camStart = 0, emberBlob = null, emberMime = "video/mp4";
var uploading = false;

function openCamera(){
  if (!me) { authSheet("login"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
    // No recorder: the camera would work but nothing could be encoded, so go
    // straight to the gallery path rather than opening a dead-end screen.
    camFail("unsupported");
    return;
  }
  var w = $("camWrap");
  w.classList.add("on");
  $("camReview").classList.remove("on");
  $("camBar").classList.remove("hidden");
  $("camTimer").classList.remove("on");
  startCam(camFacing);
}
/* The first getUserMedia call asks for exactly what we want: portrait 720x1280
   from the chosen camera with the mic. Phones are not obliging, and a device
   with no front camera, no mic or a camera busy in another app rejects that
   outright with OverconstrainedError / NotFoundError / NotReadableError. The
   old code caught all of that in one handler and said "check the app's
   permissions", which is both wrong and unactionable. So the request is retried
   with progressively looser constraints, and only a genuine NotAllowedError
   (the user said no) is reported as a permissions problem. */
var CAM_TRIES = [
  function(f){ return { video: { facingMode: { ideal: f }, width: { ideal: 720 }, height: { ideal: 1280 } },
                        audio: { echoCancellation: true, noiseSuppression: true } }; },
  function(f){ return { video: { facingMode: { ideal: f } }, audio: true }; },
  function(f){ return { video: true, audio: true }; },
  function(){ return { video: true }; }
];
/* Flipping is a different problem and needs a different ladder. "ideal" is a
   HINT, not a request: the browser is free to hand back any camera it likes,
   and Android's WebView routinely answers an {ideal:"environment"} request with
   the front one. That is why the flip button did nothing on a real phone - it
   re-opened the camera you were already looking at, over the top of a toast
   that said "Back camera". "exact" asks for the camera it names or fails, so a
   device that genuinely has no back camera says so instead of lying quietly.
   The looser rungs only run when exact is rejected outright, and camMatches()
   still throws away any stream that turns out to be the wrong camera. */
var CAM_FLIP_TRIES = [
  function(f){ return { video: { facingMode: { exact: f } }, audio: { echoCancellation: true, noiseSuppression: true } }; },
  function(f){ return { video: { facingMode: { exact: f } }, audio: true }; },
  function(f){ return { video: { facingMode: { ideal: f } }, audio: true }; },
  function(){ return { video: true, audio: true }; }
];
/* The device the camera is currently on, so a flip can be checked by identity
   as well as by facingMode - some devices report one but not the other. */
var camDeviceId = null;
/* Did we actually get the camera we asked for? Reports facingMode when the
   device tells us, falls back to "is this a different device", and returns true
   when the device says nothing at all - there is no way to tell, and refusing
   to switch on a device that merely omits the field would be worse. */
function camMatches(s, facing){
  var tr = s && s.getVideoTracks && s.getVideoTracks()[0];
  if (!tr) return false;
  var st = (tr.getSettings && tr.getSettings()) || {};
  if (st.facingMode) return st.facingMode === facing;
  if (st.deviceId && camDeviceId) return st.deviceId !== camDeviceId;
  return true;
}
function camFacingOf(s){
  var tr = s && s.getVideoTracks && s.getVideoTracks()[0];
  var st = (tr && tr.getSettings && tr.getSettings()) || {};
  return st.facingMode || "";
}
/* flipping = we are changing camera, which must either change or be reported
   as impossible. announce = say which camera we ended up on, and only once we
   know it, so the toast can never contradict the picture. */
function startCam(facing, flipping, announce){
  var prev = camFacing, wasOpen = !!camStream;
  stopCamStream();
  var tries = flipping ? CAM_FLIP_TRIES : CAM_TRIES;
  var i = 0;
  function attempt(){
    if (i >= tries.length) {
      // Nothing on the ladder produced the camera we asked for.
      if (flipping) {
        camFacing = prev;                       // put the selection back
        if (wasOpen) startCam(prev, false);     // and restore what was working
        else camFail("nocam");
        toast(wasOpen ? "This phone would not switch cameras" : "No camera available");
      } else camFail("nocam");
      return;
    }
    var cons = tries[i++](facing);
    navigator.mediaDevices.getUserMedia(cons).then(function(s){
      if (!camMatches(s, facing)) {
        // Handed the wrong camera. Drop it on the floor and try the next rung
        // rather than showing it and calling it a successful flip.
        try { s.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
        attempt();
        return;
      }
      camStream = s;
      var tr = s.getVideoTracks()[0];
      var st = (tr && tr.getSettings && tr.getSettings()) || {};
      camDeviceId = st.deviceId || null;
      var v = $("camVideo");
      v.srcObject = s;
      // Mirror on the real facing when we have one, else on what we asked for.
      v.classList.toggle("mirror", (camFacingOf(s) || facing) === "user");
      v.play().catch(function(){});
      if (announce) toast((camFacingOf(s) || facing) === "user" ? "Front camera" : "Back camera");
    }).catch(function(e){
      var name = (e && e.name) || "";
      // A device that cannot satisfy the request at all: try the next one.
      if (i < tries.length && name !== "NotAllowedError" && name !== "SecurityError") { attempt(); return; }
      if (name === "NotAllowedError" || name === "SecurityError") camFail("denied");
      else if (name === "NotReadableError" || name === "TrackStartError") camFail("busy");
      else camFail("nocam");
    });
  }
  attempt();
}
/* Why the camera did not open, said plainly, with the way out. */
function camFail(reason){
  var titles = {
    denied: "Camera permission needed",
    nocam: "No camera available",
    busy: "Camera is busy",
    unsupported: "Recording not supported here"
  };
  var bodies = {
    denied: window.Android && window.Android.hasCamPerms && !window.Android.hasCamPerms()
      ? "FirFall was not allowed to use the camera. Open Android Settings, allow Camera and Microphone for FirFall, then try again."
      : "Recording needs your permission to use the camera and microphone.",
    nocam: "This device reported no usable camera. You can still post an ember from your gallery.",
    busy: "Another app is using the camera. Close it and try again.",
    unsupported: "This browser cannot record video. You can still post an ember from your gallery."
  };
  closeCamera();
  openSheet(
    '<div id="sheetTitle">' + (titles[reason] || "Camera unavailable") + '</div>' +
    '<div id="sheetSub">' + (bodies[reason] || "") + '</div>' +
    '<button class="sheet-go" style="margin-top:16px" id="camRetry">Try again</button>' +
    (window.Android && window.Android.openAppSettings ? '<button class="sheet-alt" style="margin-top:10px;width:100%" id="camSet">Open Android settings</button>' : '') +

function stopCamStream(){

function stopCamRecording(){

/* Recording: start on the shutter, auto-stop at 60s or when the duration is
   reached again by hand, then hand the blob to the review screen. */
$("camRec").onclick = function(){
  // Second tap while recording stops early — forced 60s takes are miserable.
  if (camRec) {
    stopCamRecording();
    $("camRec").classList.remove("rec");
    return;
  }
  if (!camStream) { startCam(camFacing); return; }
  var mimes = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  var mime = null;
  for (var i = 0; i < mimes.length; i++) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mimes[i])) { mime = mimes[i]; break; }
  }
  try {
    camRec = new MediaRecorder(camStream, mime ? { mimeType: mime, videoBitsPerSecond: 2500000 } : undefined);
  } catch(e) {
    try { camRec = new MediaRecorder(camStream); } catch(e2) { toast("Could not start recording"); return; }
  }
  camChunks = [];
  camRec.ondataavailable = function(e){ if (e.data && e.data.size) camChunks.push(e.data); };
  camRec.onstop = function(){
    var secs = (Date.now() - camStart) / 1000;
    $("camTimer").classList.remove("on");
    $("camBar").classList.add("hidden");
    if (!camChunks.length || secs < 1) { emberBlob = null; toast("Clip too short — hold longer"); $("camBar").classList.remove("hidden"); return; }
    emberMime = (camRec && camRec.mimeType) || mime || "video/webm";
    emberBlob = new Blob(camChunks, { type: emberMime.split(";")[0] });
    camChunks = [];
    var rv = $("reviewVideo");
    rv.src = URL.createObjectURL(emberBlob);
    rv.play().catch(function(){});
    $("camReview").classList.add("on");
  };
  camStart = Date.now();
  try { camRec.start(250); } catch(e) { toast("Could not start recording"); return; }
  $("camRec").classList.add("rec");
  $("camTimer").classList.add("on");
  camTimerIv = setInterval(function(){
    var s = Math.min(EMBER_MAX_S, Math.round((Date.now() - camStart) / 1000));
    $("camTimerTxt").textContent = "0:" + (s < 10 ? "0" : "") + s + " / 0:60";
    if (s >= EMBER_MAX_S) {
      stopCamRecording();

    }

};
$("camRetake").onclick = function(){

/* A gallery pick is a File, not a recording: probe its real length with a
   throwaway <video> element, because the phone cannot be trusted to name a
   clip honestly and the worker rejects embers over the cap. */
$("emberFile").onchange = function(){
  var f = this.files && this.files[0];
  if (!f) return;
  probeDuration(URL.createObjectURL(f), function(d){
    if (!isFinite(d) || d <= 0) { toast("Could not read that clip's length"); return; }
    if (d > EMBER_MAX_S + 1.5) { toast("That clip is " + Math.round(d) + "s — embers are 60s or less"); return; }
    emberBlob = f;
    emberNameSheet(d);
  });
};
/* Most phone clips (MediaRecorder webm, 3GP, some MP4s) report a duration of
   Infinity until forced to resolve it: seeking past the end makes the element
   read the real header value. Without this every recording made by the app
   itself was rejected as "could not read that clip's length". */
function probeDuration(url, cb){
  var v = document.createElement("video");
  v.preload = "metadata";
  var settled = false;
  function finish(d){ if (settled) return; settled = true; cb(d); }
  function good(){ return isFinite(v.duration) && v.duration > 0; }
  v.onloadedmetadata = function(){
    if (good()) { finish(v.duration); return; }
    try { v.currentTime = 1e101; } catch(e){}
  };
  v.ondurationchange = function(){ if (good()) finish(v.duration); };
  v.ontimeupdate = function(){ if (good()) finish(v.duration); };
  v.onerror = function(){ finish(NaN); };
  setTimeout(function(){ finish(good() ? v.duration : NaN); }, 8000);
  v.src = url;
  // The object URL exists only to read metadata; the File itself is uploaded,
  // so it is released as soon as the duration is known.
  setTimeout(function(){ try { URL.revokeObjectURL(url); } catch(e){} }, 20000);
}
/* Phones hand back a content:// URI whose File.type is often empty or a
   made-up value, so the extension is the reliable signal and the mime is
   derived from it. */
var EXT_MIME = {
  mp4: "video/mp4", m4v: "video/mp4", mov: "video/quicktime", qt: "video/quicktime",
  webm: "video/webm", mkv: "video/x-matroska", "3gp": "video/3gpp", "3gpp": "video/3gpp",
  "3g2": "video/3gpp2", ts: "video/mp2t", mts: "video/mp2t", m2ts: "video/mp2t",
  avi: "video/x-msvideo", ogv: "video/ogg", ogg: "video/ogg",
  mpg: "video/mpeg", mpeg: "video/mpeg", flv: "video/x-flv", wmv: "video/x-ms-wmv"
};
function videoTypeOf(file, fallback){
  var name = String(file.name || "").toLowerCase();
  var ext = (name.split(".").pop() || "").split("?")[0];
  if (EXT_MIME[ext]) return EXT_MIME[ext];
  var t = String(file.type || "").toLowerCase();
  if (t.indexOf("video/") === 0) return t;
  return fallback || "video/mp4";
}
$("camPost").onclick = function(){
  if (!emberBlob) return;
  var secs = Math.min(EMBER_MAX_S, Math.max(1, Math.round((Date.now() - camStart) / 1000)));
  emberNameSheet(secs);
};

/* ---------- naming ---------- */
/* An ember called "Ember" is invisible in a feed full of them, and a phone is
   the worst place to be asked for a title *after* a thirty second recording has
   been made - by then people tap straight through. So the name is asked once,
   right after the clip exists and before a single byte is uploaded, and an
   untouched field posts the default rather than rejecting an empty title.
   The clip stays in emberBlob while this sheet is open, so Cancel throws the
   recording away instead of stranding it. */
function defaultEmberName(){ return (me || "My") + "'s Ember"; }
function emberNameSheet(durSecs){
  var suggested = defaultEmberName();
  openSheet(
    '<div id="sheetTitle">Name your ember</div>' +
    '<div id="sheetSub">' + (durSecs ? Math.round(durSecs) + " second clip. " : "") +
      'Give it a title so people can find it. Leave the title empty and it is called "' + esc(suggested) + '".</div>' +
    '<div class="field"><label>Title</label><input id="emTitle" maxlength="100" ' +
      'placeholder="' + esc(suggested) + '" enterkeyhint="next"></div>' +
    '<div class="field"><label>Description</label><textarea id="emDesc" rows="2" ' +
      'maxlength="2000" placeholder="Optional"></textarea></div>' +
    '<div class="sheet-msg" id="emMsg"></div>' +
    '<button class="sheet-go" id="emGo">Post ember</button>' +
    '<button class="sheet-alt" id="emCancel">Discard this ember</button>'
  );
  var ti = $("emTitle"), de = $("emDesc"), msg = $("emMsg"), go = $("emGo");
  function post(){
    // The API accepts 1-100 characters of title and 2000 of description, so the
    // same clamp happens here to save a round trip and a raw 400.
    var title = (ti.value || "").replace(/\s+/g, " ").trim().slice(0, 100) || suggested;
    var desc = (de.value || "").trim().slice(0, 2000);
    closeSheet();
    emberUpload(title, desc, durSecs);
  }
  go.onclick = post;
  ti.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); post(); } });
  $("emCancel").onclick = function(){ closeSheet(); closeCamera(); };
  try{ ti.focus(); }catch(e){}
}

/* ---------- the upload itself ----------
   Same protocol as the website client: /api/uploads/start with kind=ember,
   then 6MB chunks to /api/uploads/chunk with resume offsets, then
   /api/uploads/complete with a JPEG thumbnail. The title comes from the naming
   sheet and falls back to "<your channel>'s Ember" if somehow it is blank. */
function emberUpload(name, desc, durSecs){
  if (!me) { authSheet("login"); return; }
  if (uploading) return;
  if (!emberBlob) { toast("Record or choose a clip first"); return; }
  // The naming sheet supplies both, but emberUpload is reachable from more than
  // one path, so neither is trusted to be present.
  name = String(name || "").trim().slice(0, 100) || defaultEmberName();
  desc = String(desc || "").trim().slice(0, 2000);
  uploading = true;
  var w = $("camWrap");
  if (w.classList.contains("on")) { stopCamStream(); }
  openSheet(
    '<div id="sheetTitle">Posting ember</div>' +
    '<div id="sheetSub">Public • 9:16 vertical clip</div>' +
    '<div id="upProgWrap" class="on"><div class="up-bar"><div class="up-fill" id="upFill"></div></div>' +
    '<div id="upState">Starting…</div></div>'
  );
  var file = emberBlob instanceof File ? emberBlob : new File([emberBlob], "ember.webm", { type: emberBlob.type || "video/webm" });
  var mime = videoTypeOf(file, emberMime || "video/mp4");
  var MIME_EXT = { "video/mp4":"mp4", "video/quicktime":"mov", "video/x-matroska":"mkv", "video/3gpp":"3gp",
    "video/3gpp2":"3g2", "video/mp2t":"ts", "video/ogg":"ogv", "video/x-msvideo":"avi", "video/mpeg":"mpg",
    "video/x-flv":"flv", "video/x-ms-wmv":"wmv" };
  var ext = MIME_EXT[mime] || "webm";
  // Keep the original name when it already carries an extension; "clip.mp4"
  // must not become "clip.mp4.webm" on the way to storage.
  var given = String(name || "");
  var hasExt = EXT_MIME[(given.toLowerCase().split(".").pop() || "")];
  var filename = hasExt ? given : (given + "." + ext);
  var prog = function(p, label){ var f = $("upFill"), s = $("upState"); if (f) f.style.width = Math.round(p * 100) + "%"; if (s) s.textContent = label; };
  var sess = null, chunkSize = 6e6;
  prog(0.02, "Starting…");
  api("/api/uploads/start", {
    method: "POST",
    body: { filename: filename, mime: mime, size: file.size, title: name,
      description: desc, duration: durSecs, visibility: "public", kind: "ember", scan: "skipped" }
  }).then(function(j){
    sess = j.sessionId; chunkSize = j.chunkSize || 6e6;
    return sendChunks(sess, file, chunkSize, prog);
  }).then(function(){
    prog(0.9, "Finishing…");
    return emberThumb(file).then(function(thumbBlob){
      var fd = new FormData();
      fd.append("sessionId", sess);
      if (thumbBlob) fd.append("thumb", thumbBlob, "thumb.jpg");
      return fetch(API + "/api/uploads/complete", {
        method: "POST", headers: { "Authorization": "Bearer " + token() }, body: fd
      }).then(function(r){ return r.json().then(function(jj){ return { status: r.status, j: jj }; }); });
    });
  }).then(function(x){
    uploading = false;
    if (x.status === 202) { closeSheet(); emberBlob = null; closeCamera(); toast("Ember held for review"); return; }
    if (!x.status.toString || x.status !== 200) throw new Error(x.j.error || "Upload failed (" + x.status + ")");
    closeSheet(); emberBlob = null; closeCamera();
    toast("Ember posted! It is live in the Embers feed.");
    tab("embers");
  }).catch(function(e){
    uploading = false;
    closeSheet();
    closeCamera();
    toast(e.message || "Upload failed — try again");
  });
}
function sendChunks(sess, file, chunkSize, prog){
  var off = 0;
  function step(){
    if (off >= file.size) return Promise.resolve();
    var end = Math.min(file.size, off + chunkSize);
    var fd = new FormData();
    fd.append("sessionId", sess);
    fd.append("off", String(off));
    fd.append("chunk", file.slice(off, end), "chunk");
    return fetch(API + "/api/uploads/chunk", {
      method: "POST", headers: { "Authorization": "Bearer " + token() }, body: fd
    }).then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j }; }); }).then(function(x){
      if (x.status !== 200) throw new Error(x.j.error || "Chunk failed");
      off = x.j.uploaded;            // the server's counter is authoritative
      prog(0.05 + 0.8 * (off / file.size), "Uploading " + Math.round(off / file.size * 100) + "%");
      return step();
    });
  }
  return step();
}
/* Embers play vertical, so the thumbnail is drawn at 9:16 regardless of the
   clip's real shape. A missing thumbnail only costs the shelf its picture. */
function emberThumb(file){
  return new Promise(function(res){
    var v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "metadata";
    var url = URL.createObjectURL(file);
    v.src = url;
    var done = false;
    function grab(){
      if (done) return; done = true;
      try {
        var c = document.createElement("canvas");
        c.width = 450; c.height = 800;
        var cover = Math.max(c.width / v.videoWidth || 1, c.height / v.videoHeight || 1);
        var dw = v.videoWidth * cover, dh = v.videoHeight * cover;
        c.getContext("2d").drawImage(v, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ res(b || null); }, "image/jpeg", 0.8);
      } catch(e) { URL.revokeObjectURL(url); res(null); }
    }
    v.onloadeddata = function(){ setTimeout(grab, 300); };
    v.onerror = function(){ URL.revokeObjectURL(url); res(null); };
    setTimeout(function(){ grab(); }, 4000);
  });
}

/* =====================================================================
   SHORTS
   =====================================================================
   One ember per screen, swipe up for the next - the Shorts gesture. The track
   is a scroll-snap container, so the swipe, the snap and the momentum come
   from the platform; an IntersectionObserver decides which slide is "current"
   and plays it. Every video is muted and looping by default because that is
   the only combination a browser will autoplay without a user gesture, and
   unmuting is one tap away in the top bar. */
var shortsIO = null, shortsList = [], shortsMuted = true, shortsCurrent = null;
var curFeedList = [];
/* One-shot. The comment button sends you to the full watch page on purpose,
   so loadWatch has to know not to bounce you straight back into here. */
var watchPlain = false;

function shortSlide(v, i){
  return '<div class="short" data-i="' + i + '">' +
    '<div class="short-stage">' +
      '<video playsinline loop muted preload="none" poster="' + esc(mediaUrl("t", v.id)) + '"></video>' +
      '<div class="short-tap"></div>' +
      '<div class="short-big">' + ICON.play + '</div>' +
      '<div class="short-info"><div class="sh-at">@' + esc(v.owner) + '</div>' +
        '<div class="sh-ti">' + esc(v.title) + '</div></div>' +
      '<div class="short-rail">' +
        '<div class="sh-av' + (me === v.owner ? " mine" : "") + '" data-ch="' + esc(v.owner) + '">' + esc(initials(v.owner)) + '</div>' +
        '<button data-a="like" class="s-like" aria-label="Like">' + ICON.like + '<span>Like</span></button>' +
        '<button data-a="dislike" class="s-dislike" aria-label="Dislike">' + ICON.dislike + '<span></span></button>' +
        '<button data-a="comment" class="s-cmt" aria-label="Comments">' + ICON.cmt + '<span></span></button>' +
        '<button data-a="share" class="s-share" aria-label="Share">' + ICON.share + '<span>Share</span></button>' +
      '</div>' +
      '<div class="short-prog"><i></i></div>' +
    '</div></div>';
}

/* list omitted = fetch it. The Embers tab already has the array, so it passes
   one in and the user can swipe through exactly what they were looking at. */
function openShorts(list, startId){
  if (!list) {
    $("shortsMsg").textContent = "Loading…";
    $("shortsMsg").classList.remove("hidden");
    return api("/api/videos?kind=ember&limit=50").then(function(j){
      openShorts(j.videos || [], startId);
    }).catch(function(e){ toast(e.message || "Could not load embers"); });
  }
  var items = (list || []).filter(function(v){ return v && v.id; });
  if (!items.length) { toast("No embers yet"); return; }
  shortsList = items;
  var track = $("shortsTrack");
  track.innerHTML = items.map(shortSlide).join("");
  $("shorts").classList.add("on");
  $("shortsMsg").classList.add("hidden");
  wireShorts();
  var at = 0;
  for (var i = 0; i < items.length; i++) if (items[i].id === startId) { at = i; break; }
  // Only now that the overlay is displayed is clientHeight meaningful, so the
  // scroll has to happen after the class is on - not before.
  track.scrollTop = at * track.clientHeight;
  observeShorts();
  paintShortMute();
}
function wireShorts(){
  var track = $("shortsTrack");
  Array.prototype.forEach.call(track.querySelectorAll(".short"), function(sl){
    var v = shortsList[+sl.dataset.i], video = sl.querySelector("video"), stage = sl.querySelector(".short-stage");
    // Tap to pause. A paused clip shows the play glyph, which is the only cue
    // that anything happened - a Short with no controls needs it.
    sl.querySelector(".short-tap").onclick = function(){
      if (video.paused) { video.play().catch(function(){}); stage.classList.remove("paused"); }
      else { video.pause(); stage.classList.add("paused"); }
    };
    video.addEventListener("timeupdate", function(){
      var f = video.duration && isFinite(video.duration) ? video.currentTime / video.duration : 0;
      sl.querySelector(".short-prog i").style.width = (f * 100).toFixed(2) + "%";
    });
    sl.querySelector(".sh-av").onclick = function(){ closeShorts(); curChannel = v.owner; go("channel", true); };
    sl.querySelector('[data-a="like"]').onclick = function(){ shortReact(sl, "like"); };
    sl.querySelector('[data-a="dislike"]').onclick = function(){ shortReact(sl, "dislike"); };
    sl.querySelector('[data-a="comment"]').onclick = function(){ shortComments(sl); };
    sl.querySelector('[data-a="share"]').onclick = function(){ shareVideo(v, this); };
  });
}
function observeShorts(){
  if (shortsIO) shortsIO.disconnect();
  shortsIO = new IntersectionObserver(function(entries){
    for (var i = 0; i < entries.length; i++) {
      var sl = entries[i].target, video = sl.querySelector("video");
      if (entries[i].isIntersecting && entries[i].intersectionRatio > 0.6) shortActivate(sl);
      // Never pause the slide that is currently playing - the observer can
      // report a second entry for it after a scroll has already moved on.
      else if (video && sl !== shortsCurrent) video.pause();
    }
  }, { root: $("shortsTrack"), threshold: [0, 0.6] });
  Array.prototype.forEach.call($("shortsTrack").querySelectorAll(".short"), function(sl){ shortsIO.observe(sl); });
}
function shortActivate(sl){
  var v = shortsList[+sl.dataset.i];
  if (!v) return;
  // Exactly one clip plays, always. The observer alone could not guarantee
  // that: it fires once per intersection change, so during the opening scroll
  // - or on a screen narrow enough that a neighbour is still >60% visible -
  // two slides could both be told they were current and both start. Pausing
  // every other video here makes it an invariant rather than a hope.
  if (shortsCurrent && shortsCurrent !== sl) {
    var other = shortsCurrent.querySelector("video");
    // Unconditional: pausing a video that is already paused is a no-op, but
    // guarding on .paused means a stale read lets the old clip keep going.
    if (other) other.pause();
  }
  shortsCurrent = sl;
  var video = sl.querySelector("video");
  if (!video.getAttribute("src")) video.src = mediaUrl("v", v.id);
  try { video.currentTime = 0; } catch(e){}
  sl.querySelector(".short-stage").classList.remove("paused");
  video.play().catch(function(){});
  api("/api/video/view", { method:"POST", body:{ id: v.id } }).catch(function(){});
  shortReact0(sl, v.id);
}
/* The rail's like count and state have to come from somewhere, and /api/video
   already carries both, so the active slide asks for it as it comes into view. */
function shortReact0(sl, id){
  api("/api/video?id=" + encodeURIComponent(id)).then(function(j){
    var lk = sl.querySelector(".s-like"), ds = sl.querySelector(".s-dislike");
    lk.classList.toggle("on", j.reaction === "like");
    ds.classList.toggle("on", j.reaction === "dislike");
    lk.querySelector("span").textContent = j.likes ? num(j.likes) : "Like";
  }).catch(function(){});
}
function shortReact(sl, kind){
  if (!me) { closeShorts(); authSheet("login"); return; }
  var v = shortsList[+sl.dataset.i];
  if (!v) return;
  var btn = sl.querySelector(kind === "like" ? ".s-like" : ".s-dislike");
  var want = btn.classList.contains("on") ? "none" : kind;   // tapping again clears it
  api("/api/video/react", { method:"POST", body:{ id: v.id, kind: want } }).then(function(j){
    sl.querySelector(".s-like").classList.toggle("on", j.reaction === "like");
    sl.querySelector(".s-dislike").classList.toggle("on", j.reaction === "dislike");
    sl.querySelector(".s-like span").textContent = j.likes ? num(j.likes) : "Like";
  }).catch(function(e){ toast(e.message || "Could not save that"); });
}
function paintShortMute(){
  var b = $("shortMute");
  if (b) b.innerHTML = shortsMuted ? ICON.mute : ICON.vol;
}
function toggleShortMute(){
  shortsMuted = !shortsMuted;
  paintShortMute();
  Array.prototype.forEach.call($("shortsTrack").querySelectorAll("video"), function(v){ v.muted = shortsMuted; });
}
function closeShorts(){
  if (shortsIO) { shortsIO.disconnect(); shortsIO = null; }
  shortsCurrent = null;
  var t = $("shortsTrack");
  Array.prototype.forEach.call(t.querySelectorAll("video"), function(v){
    try { v.pause(); v.removeAttribute("src"); v.load(); } catch(e){}
  });
  t.innerHTML = "";
  $("shorts").classList.remove("on");
  shortsList = [];
}
$("shortsClose").innerHTML = ICON.x;
$("shortsClose").onclick = closeShorts;
$("shortMute").onclick = toggleShortMute;
paintShortMute();

/* The feed card that stands in for an ember, and the ember passed by id when
   someone lands on it from a link or the watch route. */
function feedVideoById(id){
  for (var i = 0; i < curFeedList.length; i++) if (curFeedList[i].id === id) return curFeedList[i];
  return null;
}
/* Comments, the way a Short does it: a sheet over the player, not a jump to
   another page. The clip keeps playing behind it, which is the whole point of
   reading comments while watching. */
function shortComments(sl){
  var v = shortsList[+sl.dataset.i];
  if (!v) return;
  openSheet(
    '<div id="sheetTitle">Comments</div>' +
    '<div id="sheetSub">' + esc(v.title) + '</div>' +
    '<div id="scList" style="max-height:44vh;overflow-y:auto;margin-bottom:14px"></div>' +
    (me ? '<div class="cadd"><div class="cav vav">' + esc(initials(me)) + '</div>' +
          '<textarea id="scInput" rows="1" maxlength="500" placeholder="Add a comment..."></textarea>' +
          '<button class="cbtn" id="scSend">Comment</button></div>'
        : '<button class="sheet-go" id="scSignin">Sign in to comment</button>')
  );
  loadComments(v.id, $("scList"));
  if ($("scSignin")) $("scSignin").onclick = function(){ closeSheet(); authSheet("login"); };
  var ta = $("scInput"), send = $("scSend");
  if (ta && send) {
    ta.addEventListener("input", function(){
      ta.style.height = "auto";
      ta.style.height = Math.min(120, ta.scrollHeight) + "px";
      send.classList.toggle("go", !!ta.value.trim());
    });
    send.onclick = function(){
      var t = ta.value.trim();
      if (!t) return;
      send.disabled = true;
      api("/api/comments", { method:"POST", body:{ video_id: v.id, text: t } })
        .then(function(){ ta.value = ""; ta.style.height = "auto"; send.classList.remove("go"); send.disabled = false;
                          toast("Comment posted"); loadComments(v.id, $("scList")); })
        .catch(function(e){ send.disabled = false; toast(e.message || "Could not post that."); });
    };
  }
}

/* =====================================================================
   SEARCH
   ===================================================================== */

/* The old handler called $("qIn").focus(), but the input's id is searchInput.
   $() returns null for a missing id and .focus() on null throws, which killed
   the handler before the guarded fallback below it ran. The search bar slid in
   and the keyboard never came up. Focus the input that actually exists. */
function openSearch(){
  $("searchWrap").classList.add("on");
  var i = $("searchInput");
  if (i) setTimeout(function(){ i.focus(); i.select && i.select(); }, 220);
}
$("searchBtn").onclick = openSearch;
$("searchBack").onclick = function(){ $("searchWrap").classList.remove("on"); $("searchInput").blur(); };
$("searchGo").onclick = function(){ searchQ = $("searchInput").value.trim(); if (searchQ) doSearch(searchQ); };
$("searchClear").onclick = function(){ $("searchInput").value = ""; $("searchInput").focus(); };
/* Live search as you type. The API has no search route, so this filters the
   feed it would load anyway; the timer keeps it from firing on every keypress. */
var searchTimer = null;
$("searchInput").oninput = function(){
  var q = this.value.trim();
  clearTimeout(searchTimer);
  if (!q) { if (curTab === "search") { searchQ = ""; go("home", true); } return; }
  searchTimer = setTimeout(function(){ searchQ = q; doSearch(q); }, 260);
};
$("searchInput").onkeydown = function(e){
  if (e.key === "Enter") { clearTimeout(searchTimer); searchQ = e.target.value.trim(); if (searchQ) doSearch(searchQ); }
};
function doSearch(q){
  curTab = "search"; searchQ = q || searchQ;
  $("searchWrap").classList.remove("on");
  $("chips").classList.add("hidden");
  show("search");
  $("search").innerHTML = '<div class="spin" style="padding:40px 0"></div>';
  api("/api/videos?kind=video&limit=50").then(function(j){
    var vs = j.videos || [];
    var term = searchQ.toLowerCase();
    var hitV = vs.filter(function(v){
      return (v.title||"").toLowerCase().indexOf(term) >= 0 || (v.owner||"").toLowerCase().indexOf(term) >= 0;
    });
    var owners = {};
    vs.forEach(function(v){ owners[v.owner] = (owners[v.owner]||0) + 1; });
    var hitC = Object.keys(owners).filter(function(n){ return n.toLowerCase().indexOf(term) >= 0; });
    var label = '<div class="group-h">Results for &quot;' + esc(searchQ) + '&quot;</div>';
    $("search").innerHTML = label +
      (hitC.length ? '<div class="group-h">Channels</div>' + hitC.map(function(n){
        return '<button class="row" data-ch="' + esc(n) + '"><div class="vav">' + esc(initials(n)) + '</div>' +
          '<div class="rtxt"><div class="rt">@' + esc(n) + '</div><div class="rs">' + owners[n] + ' video' + (owners[n]===1?"":"s") + '</div></div>' +
          '<div class="rk">' + ICON.kebab + '</div></button>'; }).join("")
        : "") +
      '<div class="group-h">Videos</div>' +
      (hitV.length ? hitV.map(vcard).join("") : '<div class="empty" style="padding:20px">No videos match.</div>');
    Array.prototype.forEach.call($("search").querySelectorAll(".vcard"), function(b){
      b.onclick = function(){ curVideo = b.dataset.v; go("watch", true); };
    });
    Array.prototype.forEach.call($("search").querySelectorAll(".kebab"), function(b){
      b.onclick = function(ev){ ev.stopPropagation(); overflowMenu("video", b.dataset.k, b.closest(".vcard-wrap")); };
    });
    Array.prototype.forEach.call($("search").querySelectorAll("[data-ch]"), function(b){
      b.onclick = function(){ curChannel = b.dataset.ch; go("channel", true); };
    });
  }).catch(function(e){ $("search").innerHTML = '<div class="empty">' + esc(e.message||"Search failed.") + '</div>'; });
}

/* =====================================================================
   NOTIFICATIONS
   ===================================================================== */
/* The rows from /api/notifications carry {id, video_id, title, owner,
   created_at, read}. The old renderer read n.actor and n.text, which no row
   has, so every notification rendered as "? / activity" instead of the video
   it was about. */
function notifText(n){
  if (n.title) return n.owner ? n.owner + " uploaded " + n.title : n.title;
  return "New activity";
}
function loadNotifs(){
  show("notifs");
  if (!me) { $("notifs").innerHTML = '<div class="empty">Sign in to see notifications.</div>'; return; }
  $("notifs").innerHTML = '<div class="spin" style="padding:40px 0"></div>';
  api("/api/notifications").then(function(j){
    var ns = j.notifications || [];
    $("notifs").innerHTML = ns.length ? ns.map(function(n){
      var av = initials(n.owner || "?");
      return '<button class="row' + (n.read ? "" : " unread") + '"' + (n.video_id ? ' data-v="' + esc(n.video_id) + '"' : '') + '>' +
        '<div class="vav">' + esc(av) + '</div>' +
        '<div class="rtxt"><div class="rt">' + esc(notifText(n)) + '</div>' +
        '<div class="rs">' + esc(ago(n.created_at)) + '</div></div>' +
        (n.read ? "" : '<div class="unread-dot"></div>') + '</button>'; }).join("")
      : '<div class="empty"><div class="big">All clear</div>No notifications.</div>';
    Array.prototype.forEach.call($("notifs").querySelectorAll("[data-v]"), function(b){
      b.onclick = function(){ curVideo = b.dataset.v; go("watch", true); };
    });
    api("/api/notifications/read", { method:"POST", body:{} }).then(function(){
      $("notifDot").classList.add("hidden");
    }).catch(function(){});
  }).catch(function(e){ $("notifs").innerHTML = '<div class="empty">' + esc(e.message||"Could not load notifications.") + '</div>'; });
}
/* The dot on the bell. Polled once at boot and refreshed when the tab regains
   focus, so it is never permanently wrong in either direction. */
function refreshUnread(){
  if (!me) { $("notifDot").classList.add("hidden"); return; }
  api("/api/notifications").then(function(j){
    $("notifDot").classList.toggle("hidden", !(j.unread > 0));
  }).catch(function(){});
}
$("notifBtn").onclick = function(){ go("notifs", true); };
$("avatarBtn").onclick = function(){ go("you", true); };
$("brandBtn").onclick = function(){ tab("home"); };

/* ---------- scroll shadows + history ---------- */
$("main").addEventListener("scroll", function(){
  var s = $("main").scrollTop > 4;
  $("topbar").classList.toggle("stuck", s);
  var c = $("chips");
  if (!c.classList.contains("hidden")) c.classList.toggle("stuck", s);
});

/* =====================================================================
   PULL TO REFRESH
   Hand rolled rather than using overscroll-behavior: the feed is a real
   scrolling div, not the document, so the browser's native refresh pull only
   ever fires on the document and never here. Touch events it is.
   ===================================================================== */
(function(){
  var main = $("main"), ptr = $("ptr"), arrow = $("ptrArrow"), label = $("ptrText");
  var startY = 0, pulling = false, dist = 0, armed = false, busy = false;
  var THRESHOLD = 64;

  function set(dist2){
    // Rubber band: the further you pull the less it moves, so the gesture can
    // never run away on a long page.
    var y = Math.min(96, dist2 * 0.55);
    ptr.style.height = y + "px";
    arrow.style.transform = "translateY(" + y + "px) rotate(" + (dist2 >= THRESHOLD ? 180 : 0) + "deg)";
    ptr.style.opacity = Math.min(1, y / 40);
  }
  function reset(){
    pulling = false; armed = false;
    ptr.style.height = "0px"; ptr.style.opacity = "0";
    arrow.classList.remove("spin");
    arrow.style.transform = "translateY(0)";
  }
  main.addEventListener("touchstart", function(e){
    if (busy || main.scrollTop > 2 || e.touches.length !== 1) return;
    startY = e.touches[0].clientY; pulling = true; dist = 0;
  }, { passive: true });

  main.addEventListener("touchmove", function(e){
    if (!pulling) return;
    var dy = e.touches[0].clientY - startY;
    if (dy <= 0) { reset(); pulling = false; return; }
    dist = dy;
    armed = dy >= THRESHOLD;
    label.textContent = armed ? "Release to refresh" : "Pull to refresh";
    set(dy);
    // Once the gesture is clearly a refresh, stop the page from scrolling under
    // the pull so the content does not slide away from the finger.
    if (armed) e.preventDefault();
  }, { passive: false });

  function end(){
    if (!pulling) return;
    var go2 = armed;
    pulling = false;
    if (!go2) { reset(); return; }
    busy = true;
    arrow.classList.add("spin");
    label.textContent = "Refreshing";
    ptr.style.height = "56px";
    ptr.style.opacity = "1";
    var done = false;
    function finish(){
      if (done) return; done = true; busy = false; reset();
    }
    // The feed has no single "reload" promise, so refresh the current tab and
    // give it a beat to finish. loadHome/loadSubs/loadLibrary all replace the
    // view in place.
    feedOffset = 0; feedTotal = null;
    try{
      if (curTab === "home") loadHome();
      else if (curTab === "subs") loadSubs();
      else if (curTab === "library") loadLibrary();
      else if (curTab === "you") loadYou();
      else if (curTab === "channel") loadChannel(curChannel);
      else if (curTab === "watch") loadWatch(curVideo);
      else if (curTab === "notifs") loadNotifs();
      else if (curTab === "search") doSearch(searchQ);
    }catch(e){}
    setTimeout(finish, 900);
  }
  main.addEventListener("touchend", end, { passive: true });
  main.addEventListener("touchcancel", function(){ pulling = false; reset(); }, { passive: true });
})();

/* =====================================================================
   INFINITE SCROLL
   A scroll check rather than an IntersectionObserver: the tail marker is
   destroyed and rebuilt on every page, so an observer would have to be
   re-attached each time and would then hold a dead node. The feed is one
   scrolling element, so "close enough to the bottom" is a two-line test.
   Paging is home-only: the subscriptions feed fetches every channel at once,
   because there is no server-side "videos from my subscriptions" query.
   ===================================================================== */
$("main").addEventListener("scroll", function(){
  if (curTab !== "home" || feedLoading) return;
  if (feedTotal != null && feedOffset >= feedTotal) return;
  if (!$("feedMore")) return;
  if ($("main").scrollTop + $("main").clientHeight >= $("main").scrollHeight - 600) loadHome(true);
});

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  try{ myReports = JSON.parse(localStorage.getItem(K_MYREP) || "{}") || {}; }catch(e){ myReports = {}; }
  // The logo is the hand-made artwork, served from the site rather than inlined.
  // The APK already loads everything else from there, so shipping a second copy
  // inside the package would only add weight and a chance of the two drifting.
  // The logo image with a JavaScript fallback, assigned as a property. This
  // used to be an onerror="..." attribute in a string of markup, which cannot
  // work: the SVG fallback has double quotes in it, so the attribute ended
  // early and the browser compiled the truncated handler as JavaScript. That
  // is a SyntaxError the moment the image fails to load - which it always does
  // in the APK, where /mobile/logo.png does not exist under file://.
  // The src is RELATIVE, and that is the whole fix for the app. The APK serves
  // this page from file:///android_asset/index.html, so an absolute
  // "/mobile/logo.png" resolved to file:///mobile/logo.png - a file that does
  // not exist - and the SVG fallback was what everyone saw. A relative
  // "logo.png" resolves to /mobile/logo.png on the site and to
  // file:///android_asset/logo.png in the app, which is bundled next to this
  // page. The cache-buster is dropped under file:// where there is no cache to
  // bust and a query string is one more thing for the asset loader to trip on.
  var logoSrc = location.protocol === "file:" ? "logo.png" : "logo.png?v=22";
  var mark = $("brandMark");
  if (mark) {
    mark.innerHTML = '<img src="' + logoSrc + '" alt="FirFall" width="33" height="22">';
    var logoImg = mark.querySelector("img");
    if (logoImg) logoImg.onerror = function(){ mark.innerHTML = svgFromPoints(FLAME, "#ff0000"); };
  }
  var t = token(), u = null;
  try{ u = localStorage.getItem(K_USER); }catch(e){}
  if (t) {
    try{
      var j = await api("/api/me");
      if (j.banned) { clearSession(); showBan({ username: j.username, reason: j.ban && j.ban.reason, bannedBy: j.ban && j.ban.bannedBy, bannedAt: j.ban && j.ban.bannedAt }, null); return; }
      me = j.username; myRole = j.role || "user";
      try{ localStorage.setItem(K_USER, me); localStorage.setItem(K_ROLE, myRole); }catch(e){}
    }catch(e){ clearSession(); }
  }
  paintAvatar();
  if (me) loadMyReports();
  go("home", true);
})();

/* Expose a couple of things for the Android shell. */
window.FirFall = {
  go: go, tab: tab, api: api,
  state: function(){ return { me: me, role: myRole }; },

  /* Called by the Android shell's back button. Returns "exit" only when the
     app genuinely has nowhere left to go, so Back closes an open sheet or
     backs out of a channel before it ever backs out of the app. */
  onBack: function(){
    if ($("shorts").classList.contains("on")) { closeShorts(); return "handled"; }
    if ($("scrim").classList.contains("on")) { closeSheet(); return "handled"; }
    if ($("searchWrap").classList.contains("on")) { $("searchWrap").classList.remove("on"); return "handled"; }
    if (!$("ban").classList.contains("hidden")) return "exit";
    // A pushed screen goes back to whichever feed opened it, not always Home:
    // youTube returns you to where you were, and so does this.
    if (NAV_OWNER[curTab] === null && curTab !== "home") { go(navOrigin, true); return "handled"; }
    return "exit";
  }
};

/* Keep the screen awake while a video is actually playing, so the phone does
   not sleep mid-video. Silently does nothing in a plain browser. */
(function(){
  var v = null, on = false;
  function sync(){ if (window.Android && window.Android.keepAwake) window.Android.keepAwake(on); }
  setInterval(function(){
    var p = document.getElementById("vp");
    if (p !== v) { v = p; if (v) v.addEventListener("play", function(){ on = true; sync(); });
                            v.addEventListener("pause", function(){ on = false; sync(); }); }
  }, 1000);
})();
</script>
